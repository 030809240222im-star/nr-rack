<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NRボックス ラック調整</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: 管理者はカレンダー・優先順位・確定と再振り分け・登録・設定の各タブ、業者は登録後に入力と回収予定の2タブ。 */
:root{
  --bg:#eceff1; --surface:#ffffff; --surface2:#f3f5f6; --fg:#13222b; --muted:#5b6b74; --line:#d3dadf;
  --accent:#1d5fc4; --accent-fg:#ffffff;
  --ok:#1f8a54; --warn:#9a6410; --bad:#c03636;
  --okbg:#e2f3ea; --warnbg:#f9eed6; --badbg:#f8e0e0; --offbg:#e3e7ea;
  --now:#d9661a; --now-fg:#ffffff; --nowbg:#fdebdc;
  --c0:#2f6fd6; --c1:#e07b2a; --c2:#2a9d8f; --c3:#a64fc4; --c4:#c9a227; --c5:#d1495b; --c6:#5c7a3a; --c7:#6b7a8f;
  --f-head:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a20; --surface:#16242c; --surface2:#1c2d37; --fg:#e6edf0; --muted:#93a4ad; --line:#2c3f4a;
    --accent:#5b9bf0; --accent-fg:#0b1520;
    --ok:#4cc38a; --warn:#e0aa4a; --bad:#ef7a7a;
    --okbg:#173326; --warnbg:#3a2f15; --badbg:#3d1d1f; --offbg:#1a262d; --now:#f08a3c; --now-fg:#1a0e05; --nowbg:#3d2614; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a20; --surface:#16242c; --surface2:#1c2d37; --fg:#e6edf0; --muted:#93a4ad; --line:#2c3f4a;
  --accent:#5b9bf0; --accent-fg:#0b1520;
  --ok:#4cc38a; --warn:#e0aa4a; --bad:#ef7a7a;
  --okbg:#173326; --warnbg:#3a2f15; --badbg:#3d1d1f; --offbg:#1a262d; --now:#f08a3c; --now-fg:#1a0e05; --nowbg:#3d2614; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55;
  padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:22px}
h2{font-size:17px}
h3{font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
.top p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.role{display:inline-block;font-size:11px;font-weight:700;border-radius:10px;padding:1px 9px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);margin-left:8px;vertical-align:3px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface2);padding:3px;border-radius:8px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:6px;color:var(--muted);font-weight:700}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tabs .cnt{display:inline-block;min-width:18px;margin-left:5px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;text-align:center}
.note{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:9px 12px;font-size:12.5px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.note.bad{background:var(--badbg);color:var(--bad)}
.note.ok{background:var(--okbg);color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 12px;font-weight:700;font-size:13px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.mhead .nav{display:flex;gap:6px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.wd.sun{color:var(--bad)}
.cell{position:relative;display:flex;flex-direction:column;gap:2px;align-items:stretch;text-align:left;min-height:68px;padding:5px;border:1px solid var(--line);border-radius:7px;background:var(--surface);min-width:0;overflow:hidden}
.cell.blank{visibility:hidden}
.cell.off{background:var(--offbg);color:var(--muted)}
.cell.ok{background:var(--okbg)}
.cell.warn{background:var(--warnbg)}
.cell.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.cell .dn{font-weight:700;font-size:13px;line-height:1.2;display:flex;justify-content:space-between;gap:4px}
.cell .dn i{font-style:normal;font-size:10.5px;color:var(--ok)}
.sesbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}.dstack{display:flex;flex-direction:column;gap:14px;min-width:0}
.cell .dn em{font-style:normal;font-size:10px;font-weight:700;color:var(--bad);margin-right:auto;margin-left:3px}
.cell.holi .dn b{color:var(--bad)}.cell.mine .dn em,.cell.now .dn em,.cell.mine.holi .dn b,.cell.now.holi .dn b{color:inherit}
.cell.today .dn b{background:var(--accent);color:var(--accent-fg);border-radius:10px;padding:0 6px}
.cell .cap{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cell .evs{font-size:10.5px;font-weight:700;color:var(--accent);white-space:nowrap}
.cell .evs.none{color:var(--bad)}
.cell .bar{margin-top:auto;display:block;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.cell .bar b{display:block;height:100%;background:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.dhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:10px}
.stepper{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
input[type=number],input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],select,textarea{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:5px 8px;min-width:0}
input[type=number]{width:72px;text-align:right;font-variant-numeric:tabular-nums}
input[type=text],input[type=email],input[type=password]{width:100%}
textarea{width:100%;min-height:84px;resize:vertical}
input.bad{border-color:var(--bad);background:var(--badbg)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-bottom:12px}
.sum div{background:var(--surface2);border-radius:8px;padding:8px 10px}
.sum small{display:block;color:var(--muted);font-size:11px}
.sum b{font-family:var(--f-head);font-size:18px;font-variant-numeric:tabular-nums}
.field{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:10px}
.field>span{font-size:12px;color:var(--muted)}
.evpick{display:flex;flex-wrap:wrap;gap:6px}
.evpick label,.chk{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:3px 9px;font-weight:700;font-size:12.5px}
.chk{font-weight:400;padding:2px 7px;font-size:12px;white-space:nowrap}
.trucks{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.truck{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.slots{display:grid;gap:3px}
.slot{height:22px;border-radius:3px;border:1px dashed var(--line)}
.slot.f{border:0}
.tablewrap{overflow-x:auto;max-width:100%}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--muted);font-weight:400;text-align:right;padding:4px 6px;white-space:nowrap;position:sticky;top:0;background:var(--surface)}
th.l,td.l{text-align:left}
th:first-child,td:first-child{text-align:left}
td{padding:5px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
td.vn{white-space:normal;min-width:84px}
.chip{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.st{display:inline-block;font-size:11px;font-weight:700;border-radius:10px;padding:1px 8px}
.st.ok{background:var(--okbg);color:var(--ok)}
.st.warn{background:var(--warnbg);color:var(--warn)}
.st.bad{background:var(--badbg);color:var(--bad)}
.st.off{background:var(--offbg);color:var(--muted)}
.vtop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end;margin-bottom:12px}
@media (max-width:560px){.vtop{grid-template-columns:minmax(0,1fr)}}
.vtop label,.lbl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.set label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.evrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}
.evrow b{width:40px}
.evrow .ns{flex:1 1 220px;min-width:0}
.evrow .ns input{width:100%}
.hint{color:var(--muted);font-size:12px;margin:4px 0 0}
.empty{color:var(--muted);padding:10px 0}
.floors{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.floors td{padding:3px 6px}
.floors td.fl{font-weight:700}
.ranklist{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.rk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:16px;padding:2px 10px 2px 8px;background:var(--surface2);font-size:12.5px}
.rk b{font-family:var(--f-head)}
.cday{border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:12px}
.cday h3{margin-bottom:6px}
.mvbox{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.mvbox select{max-width:130px}.mvbox select[data-role=d]{max-width:12em}
.mvbox input[type=number]{width:54px}
.reg{max-width:520px;display:flex;flex-direction:column;gap:12px}
.qrbox{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.qrimg{background:#fff;padding:6px;border-radius:8px;border:1px solid var(--line);width:208px;height:208px;flex:none}
.qrimg svg{width:100%;height:100%;display:block}
.urlrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.urlrow input{flex:1 1 240px;min-width:0}
.muted{color:var(--muted)}
/* スマホ: 入力欄を16pxにして、タップ時にiPhoneが画面を拡大して動かさないようにする。
   階の表は内側でスクロールさせず、ページ全体の縦スクロールだけにする */
html{-webkit-text-size-adjust:100%}
body{touch-action:manipulation}
.tablewrap,.floors{overscroll-behavior-x:contain}
@media (max-width:700px){
  input,select,textarea{font-size:16px!important}
}
/* 表のカード表示は、画面の幅ではなく、表が入っている枠(panel)の幅で切り替える。
   iPad の横向きでカレンダーと日付の欄が横に並ぶと枠が狭くなるので、そのときもカードにする。
   枠の幅で切り替えられない古いブラウザでは、画面の幅で切り替える */
.panel{container-type:inline-size}
@media (max-width:700px){

  .floors{max-height:none;overflow:visible}
  /* 横長の表は1行ずつカードにして、右側の欄が見切れないようにする */
  table.rtable thead{display:none}
  table.rtable,table.rtable tbody{display:block;width:100%;min-width:0}
  table.rtable tr{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding:12px 10px;border-bottom:1px solid var(--line)}
  table.rtable td{display:flex;flex-wrap:wrap;align-items:center;align-content:flex-start;gap:3px 6px;padding:0!important;border:0!important;text-align:left;white-space:normal!important;min-width:0!important}
  table.rtable td::before{content:attr(data-label);flex-basis:100%;font-size:12px;color:var(--muted);font-weight:400}
  table.rtable td>input[type=number]{flex:0 0 auto}
  table.rtable td:first-child{grid-column:1/-1;font-size:17px;font-weight:700}
  table.rtable td:first-child::before{content:none}
  table.rtable td:empty{display:none}
  table.rtable input[type=number]{width:6em}
  /* 階の表は 階 | 保有 | 追加希望 | 出したい を1段に並べ、備考・戻し階・状態は入っているときだけ下に出す */
  .floors table.rtable tr{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 12px;padding:8px 8px;align-items:end}
  .floors table.rtable td:first-child{grid-column:1/-1;font-size:16px}
  .floors table.rtable td:nth-child(2){grid-column:1;grid-row:2}
  .floors table.rtable td:nth-child(3){grid-column:2;grid-row:2}
  .floors table.rtable td:nth-child(5){grid-column:3;grid-row:2}
  .floors table.rtable td:nth-child(4),.floors table.rtable td:nth-child(6),.floors table.rtable td:nth-child(7){grid-column:1/-1}
  .floors .stepper input{padding:0 2px!important;font-size:17px!important}
  .floors .stp{min-width:26px;padding:0 2px;font-size:16px}
  .floors .stepper input{min-width:1.8em!important}
  .floors table.rtable td{overflow:hidden}
  .floors table.rtable td::before{font-size:11px}
  .floors table.rtable td:nth-child(-n+5) input[type=number]{width:100%}
  .floors table.rtable td:nth-child(6) input[type=number]{width:5em}
  .floors th{top:0}
  .floors .stepper{width:100%;max-width:12em}
  .floors .stepper input{flex:1 1 auto;width:auto!important}
}
@container (max-width:1100px){

  .floors{max-height:none;overflow:visible}
  /* 横長の表は1行ずつカードにして、右側の欄が見切れないようにする */
  table.rtable thead{display:none}
  table.rtable,table.rtable tbody{display:block;width:100%;min-width:0}
  table.rtable tr{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding:12px 10px;border-bottom:1px solid var(--line)}
  table.rtable td{display:flex;flex-wrap:wrap;align-items:center;align-content:flex-start;gap:3px 6px;padding:0!important;border:0!important;text-align:left;white-space:normal!important;min-width:0!important}
  table.rtable td::before{content:attr(data-label);flex-basis:100%;font-size:12px;color:var(--muted);font-weight:400}
  table.rtable td>input[type=number]{flex:0 0 auto}

  table.rtable td:first-child::before{content:none}
  table.rtable td:empty{display:none}
  table.rtable input[type=number]{width:6em}
  /* 階の表は 階 | 保有 | 追加希望 | 出したい を1段に並べ、備考・戻し階・状態は入っているときだけ下に出す */
  .floors table.rtable tr{grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 12px;padding:8px 8px;align-items:end}
  .floors table.rtable td:first-child{grid-column:1/-1;font-size:16px}
  .floors table.rtable td:nth-child(2){grid-column:1;grid-row:2}
  .floors table.rtable td:nth-child(3){grid-column:2;grid-row:2}
  .floors table.rtable td:nth-child(5){grid-column:3;grid-row:2}
  .floors table.rtable td:nth-child(4),.floors table.rtable td:nth-child(6),.floors table.rtable td:nth-child(7){grid-column:1/-1}
  .floors .stepper input{padding:0 2px!important;font-size:17px!important}
  .floors .stp{min-width:26px;padding:0 2px;font-size:16px}
  .floors .stepper input{min-width:1.8em!important}
  .floors table.rtable td{overflow:hidden}
  .floors table.rtable td::before{font-size:11px}
  .floors table.rtable td:nth-child(-n+5) input[type=number]{width:100%}
  .floors table.rtable td:nth-child(6) input[type=number]{width:5em}
  .floors th{top:0}
  .floors .stepper{width:100%;max-width:12em}
  .floors .stepper input{flex:1 1 auto;width:auto!important}
}
.acct{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.login{container-type:normal;width:100%;max-width:420px;margin:24px auto;display:flex;flex-direction:column;gap:12px}
.login .lbl input{width:100%}
.login .sep{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.login .sep::before,.login .sep::after{content:"";flex:1;border-top:1px solid var(--line)}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;font-size:12.5px;text-decoration:underline}
.qrimg svg rect[fill="#ffffff"],.qrimg svg rect{shape-rendering:crispEdges}
.cell .tag{font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag2{font-size:10px;font-weight:700;background:var(--warnbg);color:var(--warn);border-radius:4px;padding:0 3px;align-self:flex-start;white-space:nowrap}
.cell.can{background:var(--okbg);border-color:var(--ok)}
.cell.can .tag{color:var(--ok)}
.cell.mine{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.cell.mine .cap,.cell.mine .tag,.cell.mine .dn i{color:var(--accent-fg)}
.cell.mine.today .dn b{background:var(--accent-fg);color:var(--accent)}
.cell.now{background:var(--now);border-color:var(--now);color:var(--now-fg)}
.cell.now .cap,.cell.now .tag,.cell.now .evs,.cell.now .dn i{color:var(--now-fg)}
.cell.now.today .dn b{background:var(--now-fg);color:var(--now)}
.cell.now.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--now)}
.todaybox{border:3px solid var(--now);background:var(--nowbg);border-radius:12px;margin:0 0 12px;overflow:hidden}
.todaybox h3{margin:0;padding:10px 14px;background:var(--now);color:var(--now-fg);font-size:18px;line-height:1.35}
.todaybox ul{margin:0;padding:10px 14px 10px 32px;font-size:17px;line-height:1.6}
.todaybox p{margin:0;padding:0 14px 10px;font-size:13px;color:var(--fg)}
.ccards{display:grid;gap:10px}
.ccard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.cc-h{font-size:16px;margin-bottom:6px}
.cc-r{display:flex;gap:10px;align-items:flex-start;padding:6px 0;border-top:1px dashed var(--line)}
.cc-r>span{flex:0 0 76px;color:var(--muted);font-size:13px;padding-top:3px}
.cc-r .mvbox input{width:5em}
.cc-r .mvbox input[type=date]{width:auto;min-width:10em}
.stepper{display:inline-flex!important;flex-direction:row!important;flex-wrap:nowrap!important;align-items:stretch;max-width:100%;vertical-align:middle;gap:0!important}
.stepper::before{content:none!important}
.stepper input{border-radius:0!important;text-align:center;min-width:0}
.stp{flex:0 0 auto;width:auto!important;min-width:36px;margin:0!important;padding:0 6px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);font-size:18px;line-height:1;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
.stp:first-child{border-radius:8px 0 0 8px;border-right:0}.stp:last-child{border-radius:0 8px 8px 0;border-left:0}
.stp:active{background:var(--line);color:var(--fg)}

/* 「930」「1030」「10:30」「10」などを「09:30」の形にする。空は""、読めないときは null */

          if(bv===null||a<b||(a===b&&nrCmp(l[0],by[bv][0])<0))bv=v});
        if(bv===null)break;
        give(by[bv][0],1);
      }
    }else nrPrio(mine).concat(nrPrio(other)).forEach(function(c){
      if(left<=0)return;
      var take=Math.min(c.q,c.it.rem,left);if(take<=0)return;
      give(c,take);
    });
    /* この日に出した台数を覚えておく(次の回収日の戻し先は、その続きから割り振る) */
    Object.keys(rowOf).forEach(function(k){var it=idx[k];if(it)it.out=(it.out||0)+rowOf[k].units});
    res.left=left;byDate[d]=res;
  });
  return {byDate:byDate,dates:dates,first:first,left:items.filter(function(i){return i.rem>0})};
}
function nrRank(vendors,sim,cfg,startStr){
  var ref=sim.dates.filter(function(d){return d>=startStr})[0]||startStr;
  var list=nrItems(vendors,startStr).map(function(it){
    return {vid:it.vid,floor:it.floor,held:it.held,want:it.want,rem:it.rem,since:it.since,ret:it.ret,p:it.p,pq:it.pq,sc:nrScore(it,ref,cfg),first:sim.first[it.vid+"|"+it.floor]||null,noEv:!nrAnyElev(it.floor,cfg)};
  });
  list.sort(nrCmp);
  list.forEach(function(r,i){r.rank=i+1});
  return {ref:ref,list:list};
}

<script>
(function(){

function fmtAt(iso){var d=iso?new Date(iso):null;return d&&!isNaN(d)?(d.getMonth()+1)+"/"+d.getDate()+" "+d.getHours()+":"+p2(d.getMinutes()):""}

/* ---- 保存 ----
   書き込みは文書まるごとではなく、変わった項目だけを送る(patch)。同じ日・同じ業者を何人かが同時に触っても、

   電波がないときは端末に残り、つながったときに自動で送られる(未送信の件数を画面上部に出す) */
var PEND={n:0,since:0};
function send(pr){
  PEND.n++;if(!PEND.since)PEND.since=Date.now();
  setTimeout(function(){if(PEND.n)render(true)},4000);
  pr.then(function(){},function(e){ui.msg="保存できませんでした("+((e&&e.code)||"error")+")。権限と通信を確認してください。";ui.msgKind="bad"})
    .then(function(){PEND.n--;if(!PEND.n)PEND.since=0;render(true)});

function persist(coll,id,obj){
  SESC=null;
  if(ENV.mode==="local"){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}return}
  var ref=ENV.db.doc(coll+"/"+id);send(obj===null?ref.delete():ref.set(obj));
}
function put(coll,id,obj){D[coll][id]=obj;if(coll==="confirmed")hydrate(obj);persist(coll,id,obj)}
function remove(coll,id){delete D[coll][id];persist(coll,id,null)}
/* patch の特別な値: {$op:"inc",n} 足す / {$op:"del"} 消す / {$op:"union",v:[…]} 配列に足す / {$op:"rm",v:[…]} 配列から除く */
function isObj(x){return !!x&&typeof x==="object"&&!Array.isArray(x)}
function mergeDeep(t,p){
  t=isObj(t)?t:{};
  Object.keys(p).forEach(function(k){var v=p[k];
    if(isObj(v)&&v.$op){
      if(v.$op==="inc")t[k]=(Number(t[k])||0)+v.n;
      else if(v.$op==="del")delete t[k];
      else if(v.$op==="union"){var a=Array.isArray(t[k])?t[k].slice():[];v.v.forEach(function(x){if(!a.some(function(y){return JSON.stringify(y)===JSON.stringify(x)}))a.push(x)});t[k]=a}
      else if(v.$op==="rm"){var j=v.v.map(function(x){return JSON.stringify(x)});t[k]=(Array.isArray(t[k])?t[k]:[]).filter(function(y){return j.indexOf(JSON.stringify(y))<0})}
    }else if(isObj(v))t[k]=mergeDeep(t[k],v);
    else t[k]=v;
  });
  return t;
}
function patch(coll,id,p){
  SESC=null;
  D[coll][id]=mergeDeep(clone(D[coll][id]||{}),p);if(coll==="confirmed")hydrate(D[coll][id]);
  if(ENV.mode==="local"){persist(coll,id,D[coll][id]);return}

}
/* 変更前と変更後を比べて、変わった項目だけの patch にする */
function diff(a,b){
  var p={},n=0;a=isObj(a)?a:{};
  Object.keys(b).forEach(function(k){
    if(isObj(a[k])&&isObj(b[k])){var d=diff(a[k],b[k]);if(d){p[k]=d;n++}}
    else if(JSON.stringify(a[k])!==JSON.stringify(b[k])){p[k]=b[k];n++}
  });
  Object.keys(a).forEach(function(k){if(!(k in b)){p[k]={$op:"del"};n++}});
  return n?p:null;
}
function save(coll,id,obj){var d=diff(D[coll][id],obj);if(d)patch(coll,id,d)}

/* 会社(vid)に属する利用中の人。approved/{人}.vid が会社ID(無ければ本人のIDが会社ID) */
/* 会社Xを会社Tにまとめる(管理者)。メンバー・台数・置いた記録・注文・追加記録・お知らせ・確定の行をTへ移し、Xの文書を消す */

  var nx=D.notices[x]||{};if(nx.items)patch("notices",t,{items:nx.items,ack:nx.ack||{}});
  Object.keys(D.confirmed).forEach(function(d){if(((D.confirmed[d]||{}).rows||[]).some(function(r){return r.vid===x}))
    mutConfirmed(d,function(cf){var out=[];cf.rows.forEach(function(r){if(r.vid===x)r.vid=t;var hit=out.filter(function(o){return o.vid===r.vid&&o.floor===r.floor&&(o.ev||null)===(r.ev||null)})[0];
      if(hit)hit.units=nrNum(hit.units)+nrNum(r.units);else out.push(r)});cf.rows=out})});
  if(D.vendors[x])remove("vendors",x);if(D.orders[x])remove("orders",x);if(D.plans[x])remove("plans",x);if(D.notices[x])remove("notices",x);
  if(vx.code)remove("codes",vx.code);
  var wd=(D.config.wd||{})[x];if(wd){var c2=clone(D.config||{});c2.wd=c2.wd||{};if(!c2.wd[t])c2.wd[t]=wd;delete c2.wd[x];putCfg(c2)}
}
/* 参加コード: 紛らわしい文字(0,O,1,I)を除いた6文字。codes/{コード} と vendors/{会社}.code に入れる */
function newCode(){var a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",c="";for(var i=0;i<6;i++)c+=a.charAt(Math.floor(Math.random()*a.length));return c}

/* 戻す台数 u を、行の戻し先に上から割り振る({階:台数})。行の台数より多い分は最後の戻し先へ */
function retSplit(r,u){

/* 盛替え業者から「無い・不足」の連絡が出ていて、まだ戻していない行 */
function problemRows(){
  var out=[],from=nrDs(new Date(Date.now()-7*864e5));
  Object.keys(D.confirmed).sort().forEach(function(d){if(d<from)return;
    (D.confirmed[d].rows||[]).forEach(function(r,i){if(nrNum(r.units)>0&&r.chk&&r.chk.k!=="ok"&&!r.back&&(ENV.admin||ENV.crew||r.vid===ENV.vid))out.push({d:d,i:i,r:r})})});
  return out;
}
/* その回に管理者が決めたエレベーター。集積指示で選んだEV(指定のEV以外でもよい)も含める */
function desigEv(k){
  var doc=D.days[k]||{},el=(doc.elev||[]).slice();
  if(!el.length)return [];
  Object.keys(doc.moves||{}).forEach(function(x){var e=nrNum(doc.moves[x].ev);if(e&&el.indexOf(e)<0)el.push(e)});
  return el.sort(function(a,b){return a-b});
}
/* 管理者が指定したエレベーター以外に、業者が置いた行(管理者・揚重業者に知らせる)。確認済みで、置いたEVが変わっていなければ出さない */
function offRows(){
  if(!(ENV.admin||ENV.crew))return [];
  var out=[],from=nrDs(new Date(Date.now()-3*864e5));
  Object.keys(D.confirmed).sort().forEach(function(d){if(d<from)return;
    var el=desigEv(d),cf=D.confirmed[d];if(!el.length)return;
    (cf.rows||[]).forEach(function(r,i){if(nrNum(r.units)<=0||r.back)return;var pe=placedEv(d,r);
      if(!pe||el.indexOf(pe)>=0)return;
      var a=((cf.st||{})[rowKey(r)]||{}).pack;if(a&&a.ev===pe)return;
      out.push({d:d,i:i,r:r,pe:pe,el:el})})});
  return out;
}
function offBox(){
  var o=offRows();if(!o.length)return "";
  var h='<div class="todaybox alert" role="alert"><h3>⚠ 指定外のエレベーターに置かれています('+o.length+'件)</h3><ul>';
  o.forEach(function(x){var r=x.r;
    h+='<li>'+fmtD(x.d)+' '+esc(rowName(r))+' <b>'+r.floor+'階 '+nrNum(r.units)+'台</b> が <b>EV'+x.pe+'</b> に置かれています(指定: '+x.el.map(function(e){return "EV"+e}).join("・")+') <button class="btn sm" data-act="packok" data-d="'+x.d+'" data-i="'+x.i+'">確認した</button></li>'});
  return h+'</ul><p>運び直すか、そのままでよいときは「確認した」を押してください(押すと消えます)。置き直されたら、また通知されます。</p></div>';
}
function isPlaced(d,r){var v=D.vendors[r.vid];return !!(v&&v.placed&&v.placed[d+"|"+r.floor])}
/* 業者が置いたエレベーター。古い記録は時刻だけなので null */
function placedEv(d,r){var v=D.vendors[r.vid],p=v&&v.placed&&v.placed[d+"|"+r.floor];return p&&typeof p==="object"?nrNum(p.ev)||null:null}
function myRows(){
  var out=[],from=nrDs(new Date(Date.now()-7*864e5));
  Object.keys(D.confirmed).sort().forEach(function(d){
    if(d<from)return;
    (D.confirmed[d].rows||[]).forEach(function(r,i){if(r.vid===ENV.vid&&nrNum(r.units)>0)out.push({d:d,i:i,r:r})});
  });
  return out;
}

/* ---- 確定済みの回収 ----
   rows(業者・階・台数・EV)は管理者が書き、搬出確認(chk)と戻し(back)は st[行の鍵] に行ごとに書く。
   読むときは hydrate で st を rows に重ねるので、画面側は r.chk / r.back をそのまま使える */
function rowKey(r){return r.vid+"|"+r.floor+"|"+(r.ev||0)}
function hydrate(cf){
  if(!cf)return cf;var st=cf.st||{};
  (cf.rows||[]).forEach(function(r){var x=st[rowKey(r)];if(!x)return;
    ["chk","back"].forEach(function(f){if(f in x){if(x[f])r[f]=x[f];else delete r[f]}})});
  return cf;
}
/* 履歴: その日の確定文書に「いつ・だれが・何を」を足していく */
function histEntry(t){return {at:nowIso(),by:who(),t:t}}
function setRowSt(d,r,fields,t){var p={st:{},at:nowIso()};p.st[rowKey(r)]=fields;if(t)p.hist={$op:"union",v:[histEntry(t)]};patch("confirmed",d,p)}
function addHist(d,t){if(D.confirmed[d])patch("confirmed",d,{hist:{$op:"union",v:[histEntry(t)]}})}
/* 連絡(備考): 揚重業者・管理者がその日の確定に書く。その日の業者・揚重業者・管理者が見られる */
function addNote(d,t){if(D.confirmed[d]){var e=histEntry(t);e.note=1;patch("confirmed",d,{hist:{$op:"union",v:[e]}})}}
function dayNotes(d){return (((D.confirmed[d]||{}).hist)||[]).filter(function(x){return x.note}).sort(function(a,b){return (a.at||"")<(b.at||"")?1:-1})}
function notesView(d,form){
  var ns=dayNotes(d),h='<div class="notes"><h3 style="margin:14px 0 6px">連絡(備考)</h3>';
  if(ns.length)h+='<ul class="hist">'+ns.map(function(x){return '<li><span class="hint" style="margin:0">'+esc(fmtAt(x.at))+' '+esc(x.by||"")+'</span><br>'+esc(x.t)+'</li>'}).join("")+'</ul>';
  else if(!form)return "";
  else h+='<p class="hint" style="margin:0 0 6px">まだありません。</p>';
  if(form)h+='<textarea id="nt-'+d+'" data-keep maxlength="300" placeholder="例: EV2前が混雑しています。11時以降に運んでください。"></textarea><button class="btn" style="margin-top:6px" data-act="note" data-d="'+d+'">連絡を書く</button><p class="hint" style="margin:4px 0 0">この日の業者・管理者のアプリに表示されます。</p>';
  return h+'</div>';
}
function mutConfirmed(k,fn){
  var before=D.confirmed[k],cf=clone(before||{rows:[]});cf.rows=cf.rows||[];fn(cf);
  cf.rows=cf.rows.filter(function(r){return nrNum(r.units)>0});
  if(ENV.admin)cf.rows.forEach(function(r){r.n=vname(r.vid)});
  if(ENV.admin&&before&&!SILENT)notifyChanges(k,before,cf);
  if(!cf.rows.length){remove("confirmed",k);return}
  /* 行に入っている確認・戻しは st に移してから行を保存する(古いデータの引き継ぎも兼ねる) */
  var st={},rows=cf.rows.map(function(r){var o=clone(r),x={};if(o.chk)x.chk=o.chk;if(o.back)x.back=o.back;delete o.chk;delete o.back;
    var cur=((before&&before.st)||{})[rowKey(r)]||{};if((x.chk&&!cur.chk)||(x.back&&!cur.back))st[rowKey(r)]=x;return o});
  var p={rows:rows,at:nowIso()};if(Object.keys(st).length)p.st=st;
  if(ENV.admin&&before){var ch=[];notifyText(before,cf).forEach(function(x){ch.push(x)});if(ch.length)p.hist={$op:"union",v:[histEntry("予定を変更: "+ch.join(" / "))]}}  patch("confirmed",k,p);
}
function rowsTotal(cf,skip){var s=0;(cf.rows||[]).forEach(function(r,i){if(i!==skip)s+=nrNum(r.units)});return s}
function retFor(vid,floor,units){var e=(D.vendors[vid]&&D.vendors[vid].floors||{})[floor];return nrRets(e,floor,nrNum(units)||1)}
function setRowRet(r,rr){if(Array.isArray(rr)){r.rets=rr;r.ret=null}else{r.ret=rr||null;delete r.rets}}
function addRow(cf,k,vid,floor,units,skipCap){
  var cap=nrNum((D.days[k]||{}).cap),room=skipCap?units:Math.max(0,cap-rowsTotal(cf));
  units=Math.min(units,room);if(units<=0)return 0;
  var cfg=nrCfg(D.config),el=((D.days[k]||{}).elev||[]).slice().sort(),ev=el.length?nrElevFor(floor,el,cfg):null,to=null;
  if(el.length&&ev===null){var mv=((D.days[k]||{}).moves||{})[vid+"|"+floor];if(mv&&nrNum(mv.ev)>=1&&nrNum(mv.ev)<=cfg.evn){ev=nrNum(mv.ev);to=nrNum(mv.to)||null}}
  var hit=null;cf.rows.forEach(function(r){if(r.vid===vid&&r.floor===floor&&(r.ev||null)===ev)hit=r});
  if(hit)hit.units=nrNum(hit.units)+units;else{var nr={vid:vid,floor:floor,units:units,ev:ev,to:to,ret:null};setRowRet(nr,retFor(vid,floor,units));cf.rows.push(nr)}
  return units;
}

/* 戻したら業者の台数に反映する。回収した階の希望と保有から回収台数を引き、戻し先の階の保有に戻した台数を足す。
   取り消せるように、実際に動かした量を back.adj に残す */
function backAdj(r,u){
  var v=D.vendors[r.vid]||{},e=(v.floors||{})[r.floor]||{},n=nrNum(r.units),adj={},sp=retSplit(r,u);
  adj[r.floor]={h:-Math.min(n,nrNum(e.h)),w:-Math.min(n,nrNum(e.w))};
  Object.keys(sp).forEach(function(to){adj[to]=adj[to]||{h:0,w:0};adj[to].h+=sp[to]});
  return adj;
}
/* 台数は「足す・引く」で送る(同時に別の人が台数を変えても消し合わない)。マイナスになった分は0として扱う */
function addFloors(vid,adj,sign){
  var fl={};Object.keys(adj).forEach(function(f){var a=adj[f],x={};
    if(Number(a.h))x.h={$op:"inc",n:sign*Number(a.h)};if(Number(a.w))x.w={$op:"inc",n:sign*Number(a.w)};if(Object.keys(x).length)fl[f]=x});
  if(Object.keys(fl).length)patch("vendors",vid,{floors:fl,updated:nowIso()});
}
function applyAdj(vid,adj,sign){addFloors(vid,adj,sign)}
/* 追加・戻しの記録(plans.logs)は1件ずつ足し引きする */
function addLog(vid,l){patch("plans",vid,{logs:{$op:"union",v:[l]},at:nowIso()})}
function delLog(vid,l){patch("plans",vid,{logs:{$op:"rm",v:[l]},at:nowIso()})}
/* 操作した人(記録用) */
function who(){
  if(ENV.admin)return ENV.email||"管理者";
  var a=ENV.crew?(D.crews[ENV.uid]||{}):(D.approved[ENV.uid]||{}),nm=a.name||(ENV.crew?((D.crewreq[ENV.uid]||{}).contact):((D.members[ENV.uid]||{}).contact))||ENV.name||ENV.email||"";
  var co=ENV.crew?(a.company||"盛替え業者"):(vname(ENV.vid)||"");
  return co+(nm&&nm!==co?" "+nm:"");
}

/* 時間の変更は、まだ確認されていない10分以内のお知らせがあれば、それを書き換えて1件にまとめる(＋−を何度も押したとき用) */
function notifyTime(vid,d,was,now){
  var n=D.notices[vid]||{},it=n.items||{},ack=n.ack||{},hit=null;
  Object.keys(it).forEach(function(id){var x=it[id];if(x.d===d&&x.t==="time"&&!ack[id]&&Date.now()-Date.parse(x.at)<10*60*1000)hit=id});

  var u={};u[hit]={msg:fmtD(d)+" の回収時間が変わりました: "+it[hit].from+" → "+now,at:nowIso()};patch("notices",vid,{items:u});
}
function rowText(r){return r.floor+"階 "+nrNum(r.units)+"台 → "+evLabel(r.ev,r.to)}

  Object.keys(ids).forEach(function(vid){var ta=vendorRows(before,vid).map(rowText).join("、"),tb=vendorRows(after,vid).map(rowText).join("、");

}
function notifyChanges(d,before,after){
  var ids={};((before&&before.rows)||[]).concat((after&&after.rows)||[]).forEach(function(r){ids[r.vid]=1});

}

/* ---- 自動確定 ---- */
var AUTO_WAIT=10*60*1000,autoTimer=null;
function daysUntil(d,t){return Math.round((nrPd(d)-nrPd(t))/864e5)}
function inAuto(d,C){return C.cfg.auto>0&&d>=C.t&&daysUntil(d,C.t)<=C.cfg.auto}
function confirmDay(d,s,auto){
  var rows=s.asg.map(function(a){var o={vid:a.vid,floor:a.floor,units:a.units,ev:a.ev||null,to:a.to||null,ret:a.ret||null,n:vname(a.vid)};if(a.rets)o.rets=a.rets;return o});
  var o={rows:rows,at:nowIso(),by:who(),hist:[histEntry(auto?"自動で確定":"確定")]};if(auto)o.auto=true;put("confirmed",d,o);notifyConfirm(d,o);
}
/* 搬出日の設定日数前(初期値2日前)になった回収日を、配分どおりに確定する。書き込めるのは管理者だけなので、管理者が開いたときに行う */
function autoConfirm(C){
  if(!ENV.admin||ENV.preview||ui.pv)return false;
  if(ENV.mode!=="local"&&!["config","days","vendors","confirmed","approved","blocked","members"].every(function(c){return LOADED[c]}))return false;
  /* エレベーター未指定の日と、管理者が直前(10分以内)に設定を変えている日は、設定が終わるまで待つ */
  var done=[],wait=0,now=Date.now();
  Object.keys(D.days).sort().forEach(function(d){
    var day=D.days[d],s=C.sim.byDate[d];
    if(D.confirmed[d]||day.hold||!nrNum(day.cap)||!(day.elev||[]).length||!inAuto(d,C)||!s||!s.asg.length)return;
    var ed=day.edited?Date.parse(day.edited):0;
    if(ed&&now-ed<AUTO_WAIT){var w=AUTO_WAIT-(now-ed)+1000;if(!wait||w<wait)wait=w;return}
    confirmDay(d,s,true);done.push(d);
  });
  if(wait){clearTimeout(autoTimer);autoTimer=setTimeout(function(){render()},wait)}
  if(done.length){ui.msg=done.map(fmtD).join("・")+"の配分を自動で確定しました(搬出日の"+C.cfg.auto+"日前)。";ui.msgKind="ok"}
  return done.length>0;
}

  for(var e=1;e<=LIM.evn;e++)h+='<label><input type="checkbox" data-f="elev" data-e="'+e+'"'+(elev.indexOf(e)>=0?' checked':'')+'>EV'+e+'</label>';

  if(cf&&elev.length){var dg=desigEv(k),stale=(cf.rows||[]).some(function(r){return r.ev&&dg.indexOf(r.ev)<0});

  h+='<div class="sum"><div><small>回収可能</small><b>'+cap+'台</b></div><div><small>配分済み</small><b>'+used+'台</b></div><div><small>空き</small><b>'+(cap-used)+'台</b></div></div>';
  var seq=[];asg.forEach(function(a){for(var i=0;i<a.units;i++)seq.push(a.vid)});

    asg.forEach(function(a){h+='<tr><td class="l">'+a.rank+(a.sc&&a.sc.crit?' <span class="st bad">余力なし</span>':'')+(a.extra?' <span class="st warn">曜日外</span>':'')+'</td><td class="l vn"><i class="chip" style="background:'+vcolor(a.vid)+'"></i>'+esc(vname(a.vid))+'</td><td>'+a.floor+'階</td><td><b>'+a.units+'</b></td><td class="l">'+evCell(a)+'</td><td class="l">'+esc(retLabel(a))+'</td></tr>'});

/* ---- 不停止階の業者の一覧 ----
   回収日のエレベーターが停まらず、まだ配分に入っていない階(と、集積指示を出した階)を、日をまたいで一覧にする。
   ここから「前日までに、どの階のどのEV前へ集積するか」を日ごとに指示できる */
function stageRows(C){
  var rows={},order=[];
  function row(vid,floor){var k=vid+"|"+floor;if(!rows[k]){rows[k]={vid:vid,floor:floor,days:[],moves:[],rem:0,sc:null,noEv:false};order.push(k)}return rows[k]}
  C.sim.dates.forEach(function(d){if(d<C.t)return;var s=C.sim.byDate[d];if(!s||s.fixed)return;
    (s.excl||[]).forEach(function(x){var r=row(x.vid,x.floor);r.days.push(d);r.rem=x.rem;r.sc=x.sc})});
  Object.keys(D.days).sort().forEach(function(d){if(d<C.t||D.confirmed[d])return;var mv=D.days[d].moves||{};
    Object.keys(mv).forEach(function(key){var q=key.split("|"),r=row(q[0],Number(q[1]));r.moves.push({d:d,key:key,ev:nrNum(mv[key].ev),to:nrNum(mv[key].to)})})});
  C.rank.list.forEach(function(x){if(x.noEv){var r=row(x.vid,x.floor);r.rem=x.rem;r.sc=r.sc||x.sc;r.noEv=true}});
  /* 設定の不停止階(どれかのEVが停まらない階)や、どのEVも停まらない階に、台数を持っている業者は、希望がなくても出す */
  var cfg=C.cfg,ns={};evList().forEach(function(e){(cfg.ns[e]||[]).forEach(function(f){ns[f]=1})});
  Object.keys(C.am).forEach(function(vid){var fl=(C.am[vid]||{}).floors||{};
    Object.keys(fl).forEach(function(k){var f=Number(k),h=nrNum(fl[k].h),w=nrNum(fl[k].w);
      if(!(f>=cfg.fmin&&f<=cfg.fmax)||(h<=0&&w<=0))return;
      if(!ns[f]&&nrAnyElev(f,cfg))return;
      var r=row(vid,f);r.held=h;r.want=w;if(!r.rem)r.rem=Math.min(w,h)})});
  order.forEach(function(k){var r=rows[k],e=((D.vendors[r.vid]||{}).floors||{})[r.floor]||{};r.held=nrNum(e.h);r.want=nrNum(e.w)});
  return order.map(function(k){return rows[k]}).sort(function(a,b){return ((b.rem>0)?1:0)-((a.rem>0)?1:0)||((b.sc&&b.sc.crit)?1:0)-((a.sc&&a.sc.crit)?1:0)||((b.sc?b.sc.total:0)-(a.sc?a.sc.total:0))||(vname(a.vid)<vname(b.vid)?-1:vname(a.vid)>vname(b.vid)?1:0)||a.floor-b.floor});
}

    if(!stops.length){e0=1;near=null;evList().forEach(function(e){var n=nrNearest(x.floor,e,cfg);if(n!==null&&(near===null||Math.abs(n-x.floor)<Math.abs(near-x.floor))){near=n;e0=e}})}
    var cur=x.moves.map(function(m){return '<div style="margin:0 0 4px">'+esc(fmtD(m.d))+' → <b>'+evLabel(m.ev,m.to)+'</b> <button class="btn sm danger" data-act="unstage2" data-d="'+m.d+'" data-key="'+esc(x.vid+"|"+x.floor)+'">外す</button></div>'}).join("");

      +'<select id="sg2-e-'+i+'" data-keep data-role="ev" aria-label="集積するエレベーター">'+evList().map(function(e){return '<option value="'+e+'"'+(e===e0?' selected':'')+'>EV'+e+'</option>'}).join("")+'</select>'
      +'<input type="number" min="'+LIM.fmin+'" max="'+LIM.fmax+'" id="sg2-t-'+i+'" data-keep data-role="to" value="'+(near||"")+'" aria-label="集積する階"><span class="hint" style="margin:0">階</span><button class="btn sm primary" data-act="stage2">指示</button></div>'
      :'<span class="hint" style="margin:0">指示できる回収日がありません(回収日を作るか、確定を取り消してください)。</span>';
    h+='<tr><td class="l vn"><i class="chip" style="background:'+vcolor(x.vid)+'"></i>'+esc(vname(x.vid))+'</td><td>'+x.floor+'階</td><td>'+(x.held||0)+'</td><td>'+(x.want||0)+'</td>'
     +'<td>'+(x.sc?x.sc.pr.toFixed(0)+'%'+(x.sc.crit?' <span class="st bad">余力なし</span>':''):'—')+'</td>'
     +'<td class="l">'+(nostop.length?nostop.map(function(e){return 'EV'+e}).join("・"):'—')+'</td>'
     +'<td class="l">'+(stops.length?stops.map(function(e){return 'EV'+e}).join("・"):'<span class="st bad">どのEVも停まりません</span>')+'</td>'
     +'<td class="l" style="white-space:normal;min-width:240px">'+(cur||'')+form+'</td></tr>';
  });
  return h+'</tbody></table></div><p class="hint" style="margin:8px 0 0">指示を出した日の画面にも同じ指示が出ます(カレンダーでその日を選ぶ)。指示のある階は、前日のお知らせに「今日中に移動」と出ます。</p></section>';
}
/* 指定EVが停まらない階の希望と、前日までの集積指示 */

  if(!elev.length)return "";

  if(mk.length){
    h+='<div class="tablewrap"><table><thead><tr><th class="l">業者</th><th>階</th><th class="l">前日までの集積先</th><th></th></tr></thead><tbody>';

    h+='</tbody></table></div>';
  }
  if(ex.length){
    h+='<div class="tablewrap" style="margin-top:8px"><table><thead><tr><th class="l">業者</th><th>階</th><th>希望</th><th>逼迫度</th><th>評価点</th><th class="l">集積先を指示</th></tr></thead><tbody>';
    ex.forEach(function(x,i){
      var e0=elev[0],near=null;evList().forEach(function(e){var n=nrStops(x.floor,e,C.cfg)?x.floor:nrNearest(x.floor,e,C.cfg);if(n!==null&&(near===null||Math.abs(n-x.floor)<Math.abs(near-x.floor))){near=n;e0=e}});

       +'<input type="number" min="'+LIM.fmin+'" max="'+LIM.fmax+'" id="sg-t-'+k+'-'+i+'" data-keep data-role="to" value="'+(near||"")+'" aria-label="集積する階"><span class="hint" style="margin:0">階</span><button class="btn sm primary" data-act="stage">指示</button></div></td></tr>';
    });

  }
  return h+'</div>';

function renderPriority(C){

  return h+'</section>';

}

      v.out+=nrNum(r.units);v.times++;if(b)v.back+=nrNum(b.u);if(c&&c.k==="none")v.none++;if(c&&c.k==="short")v.short++;

function csvDownload(name,rows){

/* 画面の差し替えは要素を作り直さずに中身だけ合わせる。スクロール位置・フォーカス・入力中の値がそのまま残る */
function sameNode(a,b){return a.nodeType===b.nodeType&&a.nodeName===b.nodeName&&(a.nodeType!==1||(a.id||"")===(b.id||""))}
function morphKids(a,b,remote){
  var bn=Array.prototype.slice.call(b.childNodes),i;
  for(i=0;i<bn.length;i++){
    var an=a.childNodes[i],nn=bn[i];
    if(!an)a.appendChild(nn);
    else if(sameNode(an,nn))morphNode(an,nn,remote);
    else a.replaceChild(nn,an);
  }
  while(a.childNodes.length>bn.length)a.removeChild(a.lastChild);
}
function morphNode(a,b,remote){
  if(a.nodeType!==1){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
  var i,at;
  for(i=a.attributes.length-1;i>=0;i--){at=a.attributes[i].name;if(!b.hasAttribute(at))a.removeAttribute(at)}
  for(i=0;i<b.attributes.length;i++){at=b.attributes[i];if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value)}
  var keep=b.hasAttribute("data-keep")||(remote&&a===document.activeElement),tag=a.nodeName;
  if(tag==="TEXTAREA"){if(!keep&&a.value!==b.value)a.value=b.value;return}
  var selv=null;
  if(tag==="SELECT"){var so=b.querySelector("option[selected]")||b.querySelector("option");selv=so?so.value:""}
  morphKids(a,b,remote);
  if(keep)return;
  if(tag==="INPUT"){
    if(a.type==="checkbox"||a.type==="radio")a.checked=b.hasAttribute("checked");
    else{var v=b.getAttribute("value")||"";if(a.value!==v)a.value=v}
  }else if(tag==="SELECT"&&selv!==null&&a.value!==selv)a.value=selv;
}

    if(!Object.keys(c.holx).length)delete c.holx;putCfg(c)}
  else if(f==="fmin"||f==="fmax"||f==="evn"){var lim=f==="evn"?NR_MAXE:NR_MAXF,nv=Math.max(1,Math.min(lim,nrNum(el.value)||1));c[f]=nv;
    if(f==="fmin"&&nv>nrCfg(c).fmax)c.fmin=nrCfg(c).fmax;putCfg(c)}
  else if(f==="perTruck"||f==="wP"||f==="wW"||f==="wH"||f==="crit"){c[f]=f==="perTruck"?(nrNum(el.value)||NR_DEF.perTruck):f==="crit"?Math.min(100,Math.max(1,nrNum(el.value)||100)):nrW(el.value,NR_DEF[f]);putCfg(c)}
  else if(f==="evr"){var e2=el.getAttribute("data-e"),i=Number(el.getAttribute("data-k"));c.ev=c.ev||{};var r2=(c.ev[e2]||[LIM.fmin,LIM.fmax]).slice();r2[i]=Math.min(LIM.fmax,nrNum(el.value)||(i?LIM.fmax:LIM.fmin));c.ev[e2]=r2;putCfg(c)}

}

/* −/＋: 押した瞬間に1つ動かし、0.4秒押し続けると連続で動かす。保存は離したとき1回だけ */
var spin=null;

/* 時間の欄(10:30 の形)は5分ずつ動かす。空のときは開始8:00、終了は開始の1時間後から */
function timeStep(inp,n){
  var t=nrTime(inp.value),m;
  if(!t){var tf=inp.id==="tt"&&nrTime((document.getElementById("tf")||{}).value||"");m=tf?Number(tf.slice(0,2))*60+Number(tf.slice(3))+60:8*60}
  else{m=Number(t.slice(0,2))*60+Number(t.slice(3));m=n>0?Math.floor(m/5)*5+5:Math.ceil(m/5)*5-5}
  m=Math.max(0,Math.min(23*60+55,m));inp.value=p2(Math.floor(m/60))+":"+p2(m%60);
}
function spinStep(inp,n){
  if(inp.classList.contains("tinput")){timeStep(inp,n);return}
  var mn=inp.getAttribute("min"),mx=inp.getAttribute("max"),v=(Number(inp.value)||0)+n;
  if(mn!=null&&mn!==""&&v<Number(mn))v=Number(mn);if(mx!=null&&mx!==""&&v>Number(mx))v=Number(mx);
  inp.value=String(v);
}
function spinEnd(){if(!spin)return;clearTimeout(spin.t);clearInterval(spin.iv);var inp=spin.inp;spin=null;inp.dispatchEvent(new Event("change",{bubbles:true}))}

/* アプリが使うデータベースの形(collection().onSnapshot / doc().set・delete・onSnapshot)に合わせる。
   業者は自分の文書しか読めないので、業者用の一覧は自分の1件だけを見る */
var OWN=["vendors","members","approved","blocked","plans","crews","crewreq","crewblocked","orders","notices"];
/* 盛替え業者のページでは、業者の入力・回収日・確定は全体を読み、登録まわりは自分の分だけ読む */
var CREW_OWN=["members","approved","blocked","crews","crewreq","crewblocked"];
/* 同じFirebaseで別アプリ(スクラップ搬出など)を動かすときは、コレクション名の頭に付ける文字(NR_CONFIG.prefix)でデータを分ける */
var PFX=CFG.prefix||"";
/* 端末にデータを残しておき、電波がないときの入力もつながったときに送る。使えないブラウザ(プライベートブラウズなど)では普通に開く */
function openStore(fb){
  var id=CFG.databaseId||"(default)";
  try{return initializeFirestore(fb,{ignoreUndefinedProperties:true,localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})},id)}
  catch(e){return initializeFirestore(fb,{ignoreUndefinedProperties:true},id)}
}
/* アプリの patch の特別な値を Firestore の値に変える */
function fsVal(v){
  if(v&&typeof v==="object"&&!Array.isArray(v)){
    if(v.$op==="inc")return increment(v.n);if(v.$op==="del")return deleteField();
    if(v.$op==="union")return arrayUnion.apply(null,v.v);if(v.$op==="rm")return arrayRemove.apply(null,v.v);
    var o={};Object.keys(v).forEach(function(k){o[k]=fsVal(v[k])});return o;
  }
  return v;
}
function makeDb(fs,u,admin){
  /* 承認前の業者は回収日などを読めないので、その拒否だけは空として扱う。管理者の拒否はルールの設定漏れなので画面に出す */
  function quiet(cb,empty,err){return function(e){if(!admin&&e&&e.code==="permission-denied")cb(empty);else if(err)err(e)}}
  return {
    collection:function(c){return {onSnapshot:function(cb,err){
      if(!admin&&(window.NR_CREW?CREW_OWN:OWN).indexOf(c)>=0)
        return onSnapshot(doc(fs,PFX+c,u.uid),function(s){cb({docs:s.exists()?[{id:s.id,data:function(){return s.data()}}]:[]})},quiet(cb,{docs:[]},err));
      return onSnapshot(collection(fs,PFX+c),function(q){cb({docs:q.docs.map(function(d){return {id:d.id,data:function(){return d.data()}}})})},quiet(cb,{docs:[]},err));
    }}},
    doc:function(p){var r=doc(fs,PFX+p);return {
      set:function(d){return setDoc(r,d)},
      patch:function(d){return setDoc(r,fsVal(d),{merge:true})},
      get:function(){return getDocFs(r).then(function(s){return s.exists()?s.data():null})},
      delete:function(){return deleteDoc(r)},
      onSnapshot:function(cb,err){return onSnapshot(r,function(s){cb({exists:s.exists(),data:function(){return s.data()}})},quiet(cb,{exists:false,data:function(){}},err))}
    }}
  };
}
function makeUser(u,admin){
  return {me:async function(){return {id:u.uid,email:u.email||"",name:u.displayName||""}},id:async function(){return u.uid},canEdit:async function(){return admin}};
}
/* 承認されたら、読めるようになったデータを読み直すために開き直す */
function watchApproval(fs,u){
  var was=null;
  /* 自分の登録で作った許可は、サーバーに保存されてから開き直す(保存前に開き直すと書き込みが消える) */
  onSnapshot(doc(fs,PFX+(window.NR_CREW?"crews":"approved"),u.uid),{includeMetadataChanges:true},function(s){if(s.metadata&&s.metadata.hasPendingWrites)return;var now=s.exists();if(was===false&&now)location.reload();was=now},function(){});
}
