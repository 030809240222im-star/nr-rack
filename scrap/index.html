<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>スクラップ搬出 調整</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: 管理者はカレンダー・優先順位・確定と再振り分け・登録・設定の各タブ、業者は登録後に入力と回収予定の2タブ。 */
:root{
  --bg:#eceff1; --surface:#ffffff; --surface2:#f3f5f6; --fg:#13222b; --muted:#5b6b74; --line:#d3dadf;
  --accent:#1d5fc4; --accent-fg:#ffffff;
  --ok:#1f8a54; --warn:#9a6410; --bad:#c03636;
  --okbg:#e2f3ea; --warnbg:#f9eed6; --badbg:#f8e0e0; --offbg:#e3e7ea;
  --now:#d9661a; --now-fg:#ffffff; --nowbg:#fdebdc;
  --c0:#2f6fd6; --c1:#e07b2a; --c2:#2a9d8f; --c3:#a64fc4; --c4:#c9a227; --c5:#d1495b; --c6:#5c7a3a; --c7:#6b7a8f;
  --f-head:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a20; --surface:#16242c; --surface2:#1c2d37; --fg:#e6edf0; --muted:#93a4ad; --line:#2c3f4a;
    --accent:#5b9bf0; --accent-fg:#0b1520;
    --ok:#4cc38a; --warn:#e0aa4a; --bad:#ef7a7a;
    --okbg:#173326; --warnbg:#3a2f15; --badbg:#3d1d1f; --offbg:#1a262d; --now:#f08a3c; --now-fg:#1a0e05; --nowbg:#3d2614; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a20; --surface:#16242c; --surface2:#1c2d37; --fg:#e6edf0; --muted:#93a4ad; --line:#2c3f4a;
  --accent:#5b9bf0; --accent-fg:#0b1520;
  --ok:#4cc38a; --warn:#e0aa4a; --bad:#ef7a7a;
  --okbg:#173326; --warnbg:#3a2f15; --badbg:#3d1d1f; --offbg:#1a262d; --now:#f08a3c; --now-fg:#1a0e05; --nowbg:#3d2614; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.55;
  padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-head);margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:22px}
h2{font-size:17px}
h3{font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 16px}
.top p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.role{display:inline-block;font-size:11px;font-weight:700;border-radius:10px;padding:1px 9px;background:var(--surface2);border:1px solid var(--line);color:var(--muted);margin-left:8px;vertical-align:3px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;background:var(--surface2);padding:3px;border-radius:8px;border:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:6px;color:var(--muted);font-weight:700}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tabs .cnt{display:inline-block;min-width:18px;margin-left:5px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;text-align:center}
.note{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:9px 12px;font-size:12.5px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.note.bad{background:var(--badbg);color:var(--bad)}
.note.ok{background:var(--okbg);color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:6px 12px;font-weight:700;font-size:13px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.mhead .nav{display:flex;gap:6px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.wd.sun{color:var(--bad)}
.cell{position:relative;display:flex;flex-direction:column;gap:2px;align-items:stretch;text-align:left;min-height:68px;padding:5px;border:1px solid var(--line);border-radius:7px;background:var(--surface);min-width:0;overflow:hidden}
.cell.blank{visibility:hidden}
.cell.off{background:var(--offbg);color:var(--muted)}
.cell.ok{background:var(--okbg)}
.cell.warn{background:var(--warnbg)}
.cell.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.cell .dn{font-weight:700;font-size:13px;line-height:1.2;display:flex;justify-content:space-between;gap:4px}
.cell .dn i{font-style:normal;font-size:10.5px;color:var(--ok)}
.cell.today .dn b{background:var(--accent);color:var(--accent-fg);border-radius:10px;padding:0 6px}
.cell .cap{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cell .evs{font-size:10.5px;font-weight:700;color:var(--accent);white-space:nowrap}
.cell .evs.none{color:var(--bad)}
.cell .bar{margin-top:auto;display:block;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.cell .bar b{display:block;height:100%;background:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.dhead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;margin-bottom:10px}
.stepper{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
input[type=number],input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],select,textarea{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:5px 8px;min-width:0}
input[type=number]{width:72px;text-align:right;font-variant-numeric:tabular-nums}
input[type=text],input[type=email],input[type=password]{width:100%}
textarea{width:100%;min-height:84px;resize:vertical}
input.bad{border-color:var(--bad);background:var(--badbg)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-bottom:12px}
.sum div{background:var(--surface2);border-radius:8px;padding:8px 10px}
.sum small{display:block;color:var(--muted);font-size:11px}
.sum b{font-family:var(--f-head);font-size:18px;font-variant-numeric:tabular-nums}
.field{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:10px}
.field>span{font-size:12px;color:var(--muted)}
.evpick{display:flex;flex-wrap:wrap;gap:6px}
.evpick label,.chk{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:3px 9px;font-weight:700;font-size:12.5px}
.chk{font-weight:400;padding:2px 7px;font-size:12px;white-space:nowrap}
.trucks{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.truck{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.slots{display:grid;gap:3px}
.slot{height:22px;border-radius:3px;border:1px dashed var(--line)}
.slot.f{border:0}
.tablewrap{overflow-x:auto;max-width:100%}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-size:11px;color:var(--muted);font-weight:400;text-align:right;padding:4px 6px;white-space:nowrap;position:sticky;top:0;background:var(--surface)}
th.l,td.l{text-align:left}
th:first-child,td:first-child{text-align:left}
td{padding:5px 6px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
td.vn{white-space:normal;min-width:84px}
.chip{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.st{display:inline-block;font-size:11px;font-weight:700;border-radius:10px;padding:1px 8px}
.st.ok{background:var(--okbg);color:var(--ok)}
.st.warn{background:var(--warnbg);color:var(--warn)}
.st.bad{background:var(--badbg);color:var(--bad)}
.st.off{background:var(--offbg);color:var(--muted)}
.vtop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end;margin-bottom:12px}
@media (max-width:560px){.vtop{grid-template-columns:minmax(0,1fr)}}
.vtop label,.lbl{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.set label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.evrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 0;border-top:1px solid var(--line);font-size:12.5px}
.evrow b{width:40px}
.evrow .ns{flex:1 1 220px;min-width:0}
.evrow .ns input{width:100%}
.hint{color:var(--muted);font-size:12px;margin:4px 0 0}
.empty{color:var(--muted);padding:10px 0}
.floors{max-height:560px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.floors td{padding:3px 6px}
.floors td.fl{font-weight:700}
.ranklist{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.rk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:16px;padding:2px 10px 2px 8px;background:var(--surface2);font-size:12.5px}
.rk b{font-family:var(--f-head)}
.cday{border:1px solid var(--line);border-radius:9px;padding:10px;margin-top:12px}
.cday h3{margin-bottom:6px}
.mvbox{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.mvbox select{max-width:130px}
.mvbox input[type=number]{width:54px}
.reg{max-width:520px;display:flex;flex-direction:column;gap:12px}
.qrbox{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.qrimg{background:#fff;padding:6px;border-radius:8px;border:1px solid var(--line);width:208px;height:208px;flex:none}
.qrimg svg{width:100%;height:100%;display:block}
.urlrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.urlrow input{flex:1 1 240px;min-width:0}
.muted{color:var(--muted)}
/* スマホ: 入力欄を16pxにして、タップ時にiPhoneが画面を拡大して動かさないようにする。
   階の表は内側でスクロールさせず、ページ全体の縦スクロールだけにする */
html{-webkit-text-size-adjust:100%}
body{touch-action:manipulation}
.tablewrap,.floors{overscroll-behavior-x:contain}
@media (max-width:700px){
  input,select,textarea{font-size:16px!important}
  .floors{max-height:none;overflow:visible}
  .floors th{top:0}
}
.acct{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.login{max-width:420px;margin:24px auto;display:flex;flex-direction:column;gap:12px}
.login .lbl input{width:100%}
.login .sep{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}
.login .sep::before,.login .sep::after{content:"";flex:1;border-top:1px solid var(--line)}
.linkbtn{border:0;background:none;color:var(--accent);padding:0;font-size:12.5px;text-decoration:underline}
.qrimg svg rect[fill="#ffffff"],.qrimg svg rect{shape-rendering:crispEdges}
.cell .tag{font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag2{font-size:10px;font-weight:700;background:var(--warnbg);color:var(--warn);border-radius:4px;padding:0 3px;align-self:flex-start;white-space:nowrap}
.cell.can{background:var(--okbg);border-color:var(--ok)}
.cell.can .tag{color:var(--ok)}
.cell.mine{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.cell.mine .cap,.cell.mine .tag,.cell.mine .dn i{color:var(--accent-fg)}
.cell.mine.today .dn b{background:var(--accent-fg);color:var(--accent)}
.cell.now{background:var(--now);border-color:var(--now);color:var(--now-fg)}
.cell.now .cap,.cell.now .tag,.cell.now .evs,.cell.now .dn i{color:var(--now-fg)}
.cell.now.today .dn b{background:var(--now-fg);color:var(--now)}
.cell.now.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--now)}
.todaybox{border:3px solid var(--now);background:var(--nowbg);border-radius:12px;margin:0 0 12px;overflow:hidden}
.todaybox h3{margin:0;padding:10px 14px;background:var(--now);color:var(--now-fg);font-size:18px;line-height:1.35}
.todaybox ul{margin:0;padding:10px 14px 10px 32px;font-size:17px;line-height:1.6}
.todaybox p{margin:0;padding:0 14px 10px;font-size:13px;color:var(--fg)}
.todaybox.next{border-color:var(--accent);background:var(--surface2)}
.todaybox.next h3{background:var(--accent);color:var(--accent-fg)}
.tinput{width:5.5em;text-align:center}
.cell.mine.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.cell.past{opacity:.5}
.note.pv{background:var(--surface2);color:var(--fg);border:1px dashed var(--accent)}
.chk.ck{padding:4px 9px;font-weight:700}
.chk.ck.on{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.chk.ck.on::before{content:"✅";margin-right:2px}
tr.mine td{background:var(--surface2)}
@media (prefers-reduced-motion:no-preference){.cell,.btn{transition:box-shadow .12s,border-color .12s}}
</style>

<script>
/* ---- 優先順位と日別配分のロジック(画面から独立) ---- */
var NR_DEF={perTruck:20,wP:1,wW:15,wH:2,crit:100};
function nrNum(v){v=parseInt(v,10);return isFinite(v)&&v>0?v:0}
function nrW(v,d){var n=parseFloat(v);return isFinite(n)&&n>=0?n:d}
function nrPd(s){var a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2],12)}
function nrDs(d){function p(n){return (n<10?"0":"")+n}return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function nrDiff(a,b){return Math.round((nrPd(b)-nrPd(a))/864e5)}
function nrParseFloors(s){
  var out=[],seen={};
  String(s==null?"":s).replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-65248)}).split(/[,\s、，・]+/).forEach(function(t){
    if(!t)return;
    t=t.replace(/階/g,"").replace(/[〜~－ー−～]/g,"-");
    var m=t.match(/^(\d+)(?:-(\d+))?$/);if(!m)return;
    var a=+m[1],b=m[2]?+m[2]:a,x;if(a>b){x=a;a=b;b=x}
    for(var f=Math.max(1,a);f<=Math.min(62,b);f++){if(!seen[f]){seen[f]=1;out.push(f)}}
  });
  return out.sort(function(p,q){return p-q});
}
function nrFmtFloors(a){
  if(!a.length)return "なし";
  var out=[],i=0;
  while(i<a.length){var j=i;while(j+1<a.length&&a[j+1]===a[j]+1)j++;out.push(j>i?a[i]+"〜"+a[j]:""+a[i]);i=j+1}
  return out.join("、")+"階";
}
function nrCfg(c){
  c=c||{};
  var o={perTruck:nrNum(c.perTruck)||NR_DEF.perTruck,wP:nrW(c.wP,NR_DEF.wP),wW:nrW(c.wW,NR_DEF.wW),wH:nrW(c.wH,NR_DEF.wH),crit:Math.min(100,Math.max(1,nrW(c.crit,NR_DEF.crit)||NR_DEF.crit)),ev:{},ns:{},nsStr:{}};
  for(var e=1;e<=5;e++){var r=c.ev&&c.ev[e];
    var a=r&&r.length===2?Math.min(62,nrNum(r[0])||1):1,b=r&&r.length===2?Math.min(62,nrNum(r[1])||62):62;
    o.ev[e]=[Math.min(a,b),Math.max(a,b)];
    o.nsStr[e]=(c.ns&&c.ns[e])||"";o.ns[e]=nrParseFloors(o.nsStr[e]);
  }
  /* 業者ごとの回収曜日 {業者:[0=日〜6=土]}。指定のない業者はどの曜日でも回収する */
  o.wd={};Object.keys(c.wd||{}).forEach(function(v){var a=(c.wd[v]||[]).filter(function(x){return x>=0&&x<=6});if(a.length)o.wd[v]=a});
  return o;
}
function nrOnDay(vid,d,cfg){var a=cfg.wd[vid];return !a||a.indexOf(nrPd(d).getDay())>=0}
/* 曜日外の業者で空きを埋めるときの順: 余力なし → 逼迫度が高い → 評価点 */
function nrUrgCmp(a,b){return (b.sc.crit?1:0)-(a.sc.crit?1:0)||b.sc.pr-a.sc.pr||nrCmp(a,b)}
/* 「930」「1030」「10:30」「10」などを「09:30」の形にする。空は""、読めないときは null */
function nrTime(v){
  v=String(v||"").replace(/[０-９：]/g,function(c){return c==="："?":":String.fromCharCode(c.charCodeAt(0)-65248)}).trim();
  if(!v)return "";
  var m=/^(\d{1,2})(?::?(\d{2}))?$/.exec(v.replace(/[.時]/g,":").replace(/分$/,"").replace(/:$/,""));
  if(!m)return null;
  var h=+m[1],mi=m[2]?+m[2]:0;
  if(m[1].length===1&&!m[2]&&v.length>2)return null;
  if(h>23||mi>59)return null;
  return (h<10?"0":"")+h+":"+(mi<10?"0":"")+mi;
}
function nrStops(floor,e,cfg){var r=cfg.ev[e];return !!r&&floor>=r[0]&&floor<=r[1]&&cfg.ns[e].indexOf(floor)<0}
function nrElevFor(floor,elevs,cfg){for(var i=0;i<elevs.length;i++){if(nrStops(floor,elevs[i],cfg))return elevs[i]}return null}
function nrAnyElev(floor,cfg){for(var e=1;e<=5;e++){if(nrStops(floor,e,cfg))return true}return false}
/* 停まらない階から近い、そのEVが停まる階 */
function nrNearest(floor,e,cfg){for(var k=1;k<62;k++){if(nrStops(floor-k,e,cfg))return floor-k;if(nrStops(floor+k,e,cfg))return floor+k}return null}
function nrItems(vendors,startStr){
  var items=[];
  Object.keys(vendors).sort().forEach(function(vid){
    var fl=(vendors[vid]&&vendors[vid].floors)||{};
    Object.keys(fl).forEach(function(k){
      var f=parseInt(k,10),h=nrNum(fl[k].h),w=nrNum(fl[k].w),rem=Math.min(w,h);
      if(!(f>=1&&f<=62)||rem<=0)return;
      var rt=fl[k].same===false?nrNum(fl[k].r):0;
      items.push({vid:vid,floor:f,held:h,want:w,rem:rem,since:fl[k].s||startStr,ret:rt||null,retPending:fl[k].same===false&&!rt});
    });
  });
  return items;
}
function nrScore(it,date,cfg){
  var wait=Math.max(0,nrDiff(it.since,date)),pr=it.held>0?it.rem/it.held*100:0;
  /* 余力なし: 保有台数のうち出したい台数の割合が基準(初期値100%=全部出したい)以上。評価点に関係なく最優先にする */
  return {pr:pr,wait:wait,held:it.held,crit:it.held>0&&pr>=cfg.crit,total:cfg.wP*pr+cfg.wW*wait+cfg.wH*it.held};
}
function nrCmp(a,b){
  return (b.sc.crit?1:0)-(a.sc.crit?1:0)||b.sc.total-a.sc.total||(a.since<b.since?-1:a.since>b.since?1:0)||a.floor-b.floor||(a.vid<b.vid?-1:a.vid>b.vid?1:0);
}
/* confirmed: {日付:{rows:[{vid,floor,units,ev,to,ret}]}} 確定済みの日は行をそのまま使い、残りの希望から差し引く。
   days[日付].moves: {"vid|階":{ev,to}} 指定EVが停まらない階を、前日までにto階のEV前へ集積させる管理者の指示 */
function nrSimulate(vendors,days,cfg,startStr,confirmed){
  var items=nrItems(vendors,startStr),byDate={},first={},idx={};
  confirmed=confirmed||{};
  items.forEach(function(it){idx[it.vid+"|"+it.floor]=it});
  var dates=Object.keys(days||{}).filter(function(d){return nrNum(days[d].cap)>0&&(d>=startStr||confirmed[d])}).sort();
  dates.forEach(function(d){
    var day=days[d],elevs=(day.elev||[]).slice().sort(),moves=day.moves||{},cap=nrNum(day.cap),res={cap:cap,left:cap,elev:elevs,asg:[],excluded:0,excl:[],fixed:false},cf=confirmed[d];
    if(cf){
      res.fixed=true;var sum=0;
      (cf.rows||[]).forEach(function(r,i){
        var u=nrNum(r.units);if(u<=0)return;sum+=u;
        res.asg.push({vid:r.vid,floor:r.floor,units:u,ev:r.ev||null,to:r.to||null,ret:r.ret||null,rank:res.asg.length+1,sc:null});
        var key=r.vid+"|"+r.floor;if(!first[key])first[key]=d;
        if(d>=startStr&&!r.back){var it=idx[key];if(it){it.rem=Math.max(0,it.rem-u);it.held=Math.max(0,it.held-u)}}
      });
      res.left=Math.max(0,cap-sum);byDate[d]=res;return;
    }
    var left=cap,cand=[];
    items.forEach(function(it){
      if(it.rem<=0||it.since>d)return;
      var ev=null,to=null;
      if(elevs.length){ev=nrElevFor(it.floor,elevs,cfg);
        if(ev===null){var mv=moves[it.vid+"|"+it.floor];
          if(mv&&elevs.indexOf(nrNum(mv.ev))>=0){ev=nrNum(mv.ev);to=nrNum(mv.to)||null}
          else{res.excluded++;res.excl.push({vid:it.vid,floor:it.floor,rem:it.rem,since:it.since,sc:nrScore(it,d,cfg)});return}}}
      cand.push({it:it,ev:ev,to:to,vid:it.vid,floor:it.floor,since:it.since,sc:nrScore(it,d,cfg)});
    });
    /* その曜日の担当業者を先に回収し、積載に余裕が残ったら曜日外の業者を逼迫している順に入れる */
    var mine=cand.filter(function(c){return nrOnDay(c.vid,d,cfg)}),other=cand.filter(function(c){return !nrOnDay(c.vid,d,cfg)});
    mine.sort(nrCmp);other.sort(nrUrgCmp);res.excl.sort(nrCmp);
    mine.concat(other).forEach(function(c){
      if(left<=0)return;
      var take=Math.min(c.it.rem,left);
      c.it.rem-=take;c.it.held-=take;left-=take;
      res.asg.push({vid:c.vid,floor:c.floor,units:take,ev:c.ev,to:c.to,ret:c.it.ret,rank:res.asg.length+1,sc:c.sc,extra:!nrOnDay(c.vid,d,cfg)});
      var key=c.vid+"|"+c.floor;if(!first[key])first[key]=d;
    });
    res.left=left;byDate[d]=res;
  });
  return {byDate:byDate,dates:dates,first:first,left:items.filter(function(i){return i.rem>0})};
}
function nrRank(vendors,sim,cfg,startStr){
  var ref=sim.dates.filter(function(d){return d>=startStr})[0]||startStr;
  var list=nrItems(vendors,startStr).map(function(it){
    return {vid:it.vid,floor:it.floor,held:it.held,want:it.want,rem:it.rem,since:it.since,ret:it.ret,sc:nrScore(it,ref,cfg),first:sim.first[it.vid+"|"+it.floor]||null,noEv:!nrAnyElev(it.floor,cfg)};
  });
  list.sort(nrCmp);
  list.forEach(function(r,i){r.rank=i+1});
  return {ref:ref,list:list};
}
</script>

<script>
(function(){
var KEY="scrap-planner-v1";
var APP_URL=location.origin+location.pathname;
function qrSvg(){
  try{var q=qrcode(0,"M");q.addData(APP_URL);q.make();return q.createSvgTag({cellSize:4,margin:4,scalable:true})}
  catch(e){return '<p class="hint" style="padding:8px">QRコードを作れませんでした</p>'}
}
var WD=["日","月","火","水","木","金","土"];
var COLORS=["var(--c0)","var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)","var(--c7)"];
var ENV={mode:"local",uid:"local",realUid:"local",admin:true,preview:false,db:null,email:"",name:""};
var D={config:{},days:{},vendors:{},plans:{},members:{},approved:{},blocked:{},confirmed:{}};
var LOADED={};
var ui={tab:"cal",month:null,sel:null,vsel:null,only:false,confirm:"",msg:"",msgKind:""};
var W={},busy={};
function clone(x){return JSON.parse(JSON.stringify(x))}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function today(){return nrDs(new Date())}
function p2(n){return (n<10?"0":"")+n}
function fmtD(s){var d=nrPd(s);return (d.getMonth()+1)+"/"+d.getDate()+"("+WD[d.getDay()]+")"}
function fmtLong(s){var d=nrPd(s);return (d.getMonth()+1)+"月"+d.getDate()+"日("+WD[d.getDay()]+")"}
function fmtTime(d){return d&&d.tf?(d.tf+"〜"+(d.tt||"")):"時間未定"}
function nowIso(){return new Date().toISOString()}
ui.month=(function(){var t=new Date();return new Date(t.getFullYear(),t.getMonth(),1,12)})();
ui.sel=today();

/* ---- 保存 ---- */
function persist(coll,id,obj){
  if(ENV.mode==="local"){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}return}
  var path=coll+"/"+id;W[path]={data:obj};pump(path);
}
function pump(path){
  if(busy[path])return;busy[path]=true;
  (async function(){
    var g=0;
    while(W[path]&&g<50){
      var job=W[path];delete W[path];g++;
      try{var ref=ENV.db.doc(path);if(job.data===null)await ref.delete();else await ref.set(job.data)}
      catch(e){ui.msg="保存できませんでした("+((e&&e.code)||"error")+")。権限と通信を確認してください。";ui.msgKind="bad";render(true)}
    }
    busy[path]=false;
  })();
}
function put(coll,id,obj){D[coll][id]=obj;persist(coll,id,obj)}
function remove(coll,id){delete D[coll][id];persist(coll,id,null)}
function putCfg(o){D.config=o;persist("config","main",o)}

/* ---- 起動 ---- */
async function boot(){
  var db=null,user=null;
  try{if(window.NR_RUNTIME){db=await window.NR_RUNTIME.use("db");user=await window.NR_RUNTIME.use("user")}}catch(e){}
  if(db&&user){
    ENV.mode="db";ENV.db=db;
    var me=null;try{me=await user.me()}catch(e){}
    ENV.uid=(me&&me.id)||await user.id();ENV.email=(me&&me.email)||"";ENV.name=(me&&me.name)||"";
    ENV.admin=!!(await user.canEdit());ENV.realUid=ENV.uid;
    if(!ENV.uid)ENV.mode="noid";
    else subscribe();
  }else{
    try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);Object.keys(D).forEach(function(k){if(o[k])D[k]=o[k]})}}catch(e){}
  }
  ui.tab="cal";
  render();
}
function subscribe(){
  var err=function(e){ui.msg="データを読み込めませんでした("+((e&&e.code)||"error")+")"+(e&&e.code==="permission-denied"?"。Firebaseのセキュリティルールに、このアカウントのメールアドレスが管理者として入っているか確認してください。":"");ui.msgKind="bad";render(true)};
  var colls=["days","vendors","plans","members","approved","blocked","confirmed"];
  colls.forEach(function(c){
    ENV.db.collection(c).onSnapshot(function(snap){var m={};snap.docs.forEach(function(d){m[d.id]=d.data()});D[c]=m;LOADED[c]=true;ui.synced=new Date();render(true)},err);
  });
  ENV.db.doc("config/main").onSnapshot(function(s){D.config=s.exists?s.data():{};LOADED.config=true;ui.synced=new Date();render(true)},err);
}

/* ---- 計算 ---- */
function isActive(id){
  var v=D.vendors[id];if(!v)return false;
  if(ENV.mode==="local")return true;
  return !!(D.approved[id]||v.manual||v.sample);
}
function activeMap(){var m={};Object.keys(D.vendors).forEach(function(id){if(isActive(id))m[id]=D.vendors[id]});return m}
function compute(){
  var cfg=nrCfg(D.config),t=today(),am=activeMap(),sim=nrSimulate(am,D.days,cfg,t,D.confirmed);
  return {cfg:cfg,t:t,am:am,sim:sim,rank:nrRank(am,sim,cfg,t)};
}
function vname(id){
  return (D.approved[id]&&D.approved[id].company)||(D.vendors[id]&&D.vendors[id].name)||(D.members[id]&&D.members[id].company)||"名称未設定";
}
function vcolor(id){var ids=Object.keys(D.vendors).sort(),i=ids.indexOf(id);return COLORS[(i<0?0:i)%COLORS.length]}
function retText(r){return r?(r+"階"):"同じ階"}
/* 集積場所。toがあれば停まらない階なので、前日までにto階のEV前へ集める */
function evLabel(e,to){return e?(to?to+"階 EV"+e+"前":"EV"+e+"前"):"—"}
function evCell(r){return evLabel(r.ev,r.to)+(r.to?' <span class="st warn">前日までに移動</span>':'')}
/* 確定行の業者名。業者は他社の登録情報を読めないので、確定時に保存した名前を使う */
function rowName(r){return ENV.admin||r.vid===ENV.uid?vname(r.vid):(r.n||"他の業者")}
function isPlaced(d,r){var v=D.vendors[r.vid];return !!(v&&v.placed&&v.placed[d+"|"+r.floor])}
/* 業者が置いたエレベーター。古い記録は時刻だけなので null */
function placedEv(d,r){var v=D.vendors[r.vid],p=v&&v.placed&&v.placed[d+"|"+r.floor];return p&&typeof p==="object"?nrNum(p.ev)||null:null}
function myRows(){
  var out=[],from=nrDs(new Date(Date.now()-7*864e5));
  Object.keys(D.confirmed).sort().forEach(function(d){
    if(d<from)return;
    (D.confirmed[d].rows||[]).forEach(function(r,i){if(r.vid===ENV.uid&&nrNum(r.units)>0)out.push({d:d,i:i,r:r})});
  });
  return out;
}

/* ---- 確定済みの回収 ---- */
function mutConfirmed(k,fn){
  var cf=clone(D.confirmed[k]||{rows:[]});cf.rows=cf.rows||[];fn(cf);
  cf.rows=cf.rows.filter(function(r){return nrNum(r.units)>0});
  cf.rows.forEach(function(r){r.n=vname(r.vid)});
  if(!cf.rows.length)remove("confirmed",k);else{cf.at=nowIso();put("confirmed",k,cf)}
}
function rowsTotal(cf,skip){var s=0;(cf.rows||[]).forEach(function(r,i){if(i!==skip)s+=nrNum(r.units)});return s}
function retFor(vid,floor){var e=(D.vendors[vid]&&D.vendors[vid].floors||{})[floor];return e&&e.same===false&&nrNum(e.r)?nrNum(e.r):null}
function addRow(cf,k,vid,floor,units,skipCap){
  var cap=nrNum((D.days[k]||{}).cap),room=skipCap?units:Math.max(0,cap-rowsTotal(cf));
  units=Math.min(units,room);if(units<=0)return 0;
  var cfg=nrCfg(D.config),el=((D.days[k]||{}).elev||[]).slice().sort(),ev=el.length?nrElevFor(floor,el,cfg):null,to=null;
  if(el.length&&ev===null){var mv=((D.days[k]||{}).moves||{})[vid+"|"+floor];if(mv&&el.indexOf(nrNum(mv.ev))>=0){ev=nrNum(mv.ev);to=nrNum(mv.to)||null}}
  var hit=null;cf.rows.forEach(function(r){if(r.vid===vid&&r.floor===floor&&(r.ev||null)===ev)hit=r});
  if(hit)hit.units=nrNum(hit.units)+units;else cf.rows.push({vid:vid,floor:floor,units:units,ev:ev,to:to,ret:retFor(vid,floor)});
  return units;
}

/* 戻したら業者の台数に反映する。回収した階の希望と保有から回収台数を引き、戻し先の階の保有に戻した台数を足す。
   取り消せるように、実際に動かした量を back.adj に残す */
function backAdj(r,u){
  var v=D.vendors[r.vid]||{},e=(v.floors||{})[r.floor]||{},n=nrNum(r.units),adj={},to=nrNum(r.ret)||r.floor;
  adj[r.floor]={h:-Math.min(n,nrNum(e.h)),w:-Math.min(n,nrNum(e.w))};
  adj[to]=adj[to]||{h:0,w:0};adj[to].h+=nrNum(u);
  return adj;
}
function applyAdj(vid,adj,sign){
  mutVendor(vid,function(v){Object.keys(adj).forEach(function(f){
    var a=adj[f],e=v.floors[f]||{h:0,w:0};
    e.h=Math.max(0,nrNum(e.h)+sign*(Number(a.h)||0));e.w=Math.max(0,nrNum(e.w)+sign*(Number(a.w)||0));
    if(!nrNum(e.h)&&!nrNum(e.w))delete v.floors[f];else v.floors[f]=e;
  })});
}

/* ---- 画面 ---- */
/* 配置(業者)と戻し(管理者)のチェック欄 */
function placedCell(d,r){
  var on=isPlaced(d,r),can=ENV.admin||r.vid===ENV.uid;
  if(!can)return '<span class="muted">—</span>';
  var el=((D.days[d]||{}).elev||[]).slice().sort(),pe=placedEv(d,r),cur=pe||r.ev||el[0]||1,opts=el.length?el.slice():[1,2,3,4,5];
  if(opts.indexOf(cur)<0)opts.push(cur);
  var h='<div class="mvbox" style="margin-bottom:4px"><select id="pe-'+d+'-'+esc(r.vid)+'-'+r.floor+'" data-keep data-f="placedev" data-d="'+d+'" data-vid="'+esc(r.vid)+'" data-fl="'+r.floor+'" aria-label="置いたエレベーター">';
  opts.forEach(function(e){h+='<option value="'+e+'"'+(e===cur?' selected':'')+'>EV'+e+'</option>'});
  h+='</select><span class="hint" style="margin:0">に</span></div>';
  h+='<label class="chk ck'+(on?' on':'')+'"><input type="checkbox" data-f="placed" data-d="'+d+'" data-vid="'+esc(r.vid)+'" data-fl="'+r.floor+'"'+(on?' checked':'')+'>'+(on?'配置済み':'配置した')+'</label>';
  if(on&&pe)h+='<div class="hint" style="margin:2px 0 0">EV'+pe+'に配置</div>';
  return h;
}
function backCell(d,r,i){
  var b=r.back,el=((D.days[d]||{}).elev||[]);
  if(!ENV.admin)return b?'<span class="st ok">✅ 戻し済み</span><div class="hint" style="margin:2px 0 0">EV'+b.ev+'で'+nrNum(b.u)+'台</div>':'<span class="st off">未</span>';
  var h='<label class="chk ck'+(b?' on':'')+'"><input type="checkbox" data-f="back" data-d="'+d+'" data-i="'+i+'"'+(b?' checked':'')+'>'+(b?'戻し済み':'戻した')+'</label>';
  if(b){
    h+='<div class="mvbox" style="margin-top:4px"><select id="be-'+d+'-'+i+'" data-f="backev" data-d="'+d+'" data-i="'+i+'" aria-label="戻しに使ったエレベーター">';
    for(var e=1;e<=5;e++)h+='<option value="'+e+'"'+(nrNum(b.ev)===e?' selected':'')+'>EV'+e+'</option>';
    h+='</select><input type="number" min="0" id="bu-'+d+'-'+i+'" data-f="backu" data-d="'+d+'" data-i="'+i+'" value="'+nrNum(b.u)+'" aria-label="戻した台数"><span class="hint" style="margin:0">台</span></div>';
  }
  return h;
}
/* 日別の回収一覧(確定済み)。管理者と業者の両方で使う */
function dayRowsTable(d){
  var cf=D.confirmed[d],rows=(cf&&cf.rows)||[];
  var h='<div class="tablewrap"><table><thead><tr><th class="l">業者</th><th>階・台数</th><th class="l">集積 / 戻し階</th><th class="l">配置(業者)</th><th class="l">戻し(管理者)</th></tr></thead><tbody>';
  rows.forEach(function(r,i){
    if(nrNum(r.units)<=0)return;
    var mine=r.vid===ENV.uid&&!ENV.admin;
    h+='<tr'+(mine?' class="mine"':'')+'><td class="l vn"><i class="chip" style="background:'+(ENV.admin?vcolor(r.vid):(mine?'var(--accent)':'var(--line)'))+'"></i>'+esc(rowName(r))+'</td><td>'+r.floor+'階 <b>'+nrNum(r.units)+'台</b></td><td class="l" style="white-space:normal;min-width:96px">'+evCell(r)+'<div class="hint" style="margin:2px 0 0">戻し: '+retText(r.ret)+'</div></td><td class="l">'+placedCell(d,r)+'</td><td class="l">'+backCell(d,r,i)+'</td></tr>';
  });
  return h+'</tbody></table></div>';
}
function renderCal(C){
  var y=ui.month.getFullYear(),m=ui.month.getMonth();
  var first=new Date(y,m,1,12).getDay(),n=new Date(y,m+1,0).getDate();
  var h='<div class="main"><section class="panel">'+todayBox(C)+'<div class="mhead"><h2>'+y+'年'+(m+1)+'月</h2><div class="nav">'
   +'<button class="btn sm" data-act="prev">‹ 前月</button><button class="btn sm" data-act="today">今日</button><button class="btn sm" data-act="next">翌月 ›</button></div></div><div class="grid">';
  WD.forEach(function(w,i){h+='<div class="wd'+(i===0?' sun':'')+'">'+w+'</div>'});
  for(var i=0;i<first;i++)h+='<div class="cell blank"></div>';
  for(var d=1;d<=n;d++){
    var k=y+"-"+p2(m+1)+"-"+p2(d),doc=D.days[k],cap=doc?nrNum(doc.cap):0,s=C.sim.byDate[k],cf=D.confirmed[k];
    if(!ENV.admin){h+=vCell(k,m,d,doc,cap,cf,C);continue}
    var cls="cell";
    if(!cap)cls+=" off";else cls+=k===C.t?" now":(s&&s.left===0&&C.sim.left.length&&!cf)?" warn":" ok";
    if(k===ui.sel)cls+=" sel";if(k===C.t)cls+=" today";
    h+='<button class="'+cls+'" data-act="sel" data-date="'+k+'" aria-label="'+(m+1)+'月'+d+'日"><span class="dn"><b>'+d+'</b>'+(cf?'<i>確定</i>':'')+'</span>';
    if(!cap)h+='<span class="cap">—</span>';
    else{var rows=cf?(cf.rows||[]).filter(function(r){return nrNum(r.units)>0}):[],u=cf?rowsTotal(cf,-1):(ENV.admin&&s?cap-s.left:0);
      h+='<span class="cap">'+(cf||ENV.admin?u+'/':'')+cap+'台'+(doc.tf?' '+esc(doc.tf):'')+'</span><span class="evs'+((doc.elev&&doc.elev.length)?'':' none')+'">'+(doc.elev&&doc.elev.length?doc.elev.map(function(e){return "EV"+e}).join("·"):"EV未指定")+'</span>';
      if(cf&&ENV.admin){var np=rows.filter(function(r){return isPlaced(k,r)}).length,nb=rows.filter(function(r){return r.back}).length;
        h+='<span class="cap">配置'+np+'/'+rows.length+' 戻し'+nb+'/'+rows.length+'</span>'}
      else if(cf){var my=rows.filter(function(r){return r.vid===ENV.uid});
        if(my.length){var mu=0,allp=true;my.forEach(function(r){mu+=nrNum(r.units);if(!isPlaced(k,r))allp=false});
          h+='<span class="evs">自社'+mu+'台'+(allp?' ✅':'')+'</span>'}}
      h+='<span class="bar"><b style="width:'+Math.round(u/cap*100)+'%"></b></span>'}
    h+='</button>';
  }
  if(ENV.admin)h+='</div><div class="legend"><span><i style="background:var(--now);border-color:var(--now)"></i>本日の回収日</span><span><i style="background:var(--okbg)"></i>回収日</span><span><i style="background:var(--warnbg)"></i>満載(まだ未回収あり)</span><span><i style="background:var(--offbg)"></i>回収なし</span><span>セル: 配分/回収可能台数、開始時間、集積EV</span></div></section>';
  else h+='</div><div class="legend"><span><i style="background:var(--now);border-color:var(--now)"></i>本日の搬出日</span><span><i style="background:var(--accent);border-color:var(--accent)"></i>自社の搬出日(確定)</span><span><i style="background:var(--okbg);border-color:var(--ok)"></i>搬出可能日</span><span><i style="background:var(--offbg)"></i>回収なし</span><span><b class="tag2">前日移動</b> 前日までに別の階のEV前へ移す</span><span>日付をタップすると、その日の回収業者と台数が表示されます</span></div></section>';
  h+=(ENV.admin?renderDay(C):renderDayV())+'</div>';
  if(!ENV.admin)h+=renderMine(C);
  return h;
}
/* 業者のカレンダーのマス。搬出可能日と自社の搬出日を色で分ける */
/* 当日と翌日の搬出のお知らせ(業者は自社の分、管理者はその日の全体)。カレンダーの一番上に目立つように出す */
function todayBox(C){
  var t=C.t,tm=nrDs(new Date(nrPd(t).getTime()+864e5));
  return dayNotice(t,true)+dayNotice(tm,false);
}
function dayNotice(d,isToday){
  var cf=D.confirmed[d],day=D.days[d]||{},rows=cf?(cf.rows||[]).filter(function(r){return nrNum(r.units)>0&&(ENV.admin||r.vid===ENV.uid)}):[];
  if(!rows.length)return "";
  var tot=0,left=0,mv=false;rows.forEach(function(r){tot+=nrNum(r.units);if(!isPlaced(d,r))left++;if(r.to)mv=true});

/* 画面の差し替えは要素を作り直さずに中身だけ合わせる。スクロール位置・フォーカス・入力中の値がそのまま残る */
function sameNode(a,b){return a.nodeType===b.nodeType&&a.nodeName===b.nodeName&&(a.nodeType!==1||(a.id||"")===(b.id||""))}
function morphKids(a,b,remote){
  var bn=Array.prototype.slice.call(b.childNodes),i;
  for(i=0;i<bn.length;i++){
    var an=a.childNodes[i],nn=bn[i];
    if(!an)a.appendChild(nn);
    else if(sameNode(an,nn))morphNode(an,nn,remote);
    else a.replaceChild(nn,an);
  }
  while(a.childNodes.length>bn.length)a.removeChild(a.lastChild);
}
function morphNode(a,b,remote){
  if(a.nodeType!==1){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
  var i,at;
  for(i=a.attributes.length-1;i>=0;i--){at=a.attributes[i].name;if(!b.hasAttribute(at))a.removeAttribute(at)}
  for(i=0;i<b.attributes.length;i++){at=b.attributes[i];if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value)}
  var keep=b.hasAttribute("data-keep")||(remote&&a===document.activeElement),tag=a.nodeName;
  if(tag==="TEXTAREA"){if(!keep&&a.value!==b.value)a.value=b.value;return}
  var selv=null;
  if(tag==="SELECT"){var so=b.querySelector("option[selected]")||b.querySelector("option");selv=so?so.value:""}
  morphKids(a,b,remote);
  if(keep)return;
  if(tag==="INPUT"){
    if(a.type==="checkbox"||a.type==="radio")a.checked=b.hasAttribute("checked");
    else{var v=b.getAttribute("value")||"";if(a.value!==v)a.value=v}
  }else if(tag==="SELECT"&&selv!==null&&a.value!==selv)a.value=selv;
}

    var pc=Object.keys(D.members).filter(function(id){return !D.approved[id]}).length;
    tabs=[["cal","カレンダー"],["pri","優先順位"],["cnf","確定と再振り分け"],["vin","業者入力"],["rec","追加と戻し"],["mem","登録"+(pc?'<span class="cnt">'+pc+'</span>':"")],["set","設定"]];
  }else tabs=vendorOk?[["cal","カレンダー"],["vin","業者入力"]]:[["reg","登録"]];
  if(!ENV.admin&&!vendorOk)ui.tab="reg";else if(!ENV.admin&&ui.tab!=="cal"&&ui.tab!=="vin")ui.tab="cal";
  h='<div class="top"><div><h1>スクラップ搬出 調整<span class="role">'+(ENV.admin?'管理者':ENV.preview?'業者(プレビュー)':(vendorOk?'業者':'未登録'))+'</span></h1><p>業者が入力した階別の保有・搬出希望を、回収日ごとの台数・時間・エレベーター集積に合わせて自動で配分します</p>'+(window.NR_ACCOUNT?'<p class="acct">'+esc(window.NR_ACCOUNT.email||"")+' <button class="btn sm" data-act="logout">ログアウト</button> <button class="btn sm" data-act="reload">↻ 最新にする</button>'+(ui.synced?' <span class="muted" style="font-size:12px">'+p2(ui.synced.getHours())+':'+p2(ui.synced.getMinutes())+' 更新</span>':'')+'</p>':'')+'</div><div class="tabs" role="tablist">';
  tabs.forEach(function(t){h+='<button role="tab" aria-selected="'+(ui.tab===t[0])+'" data-act="tab" data-tab="'+t[0]+'">'+t[1]+'</button>'});
  h+='</div></div>';
  if(ENV.preview){
    var pids=Object.keys(D.vendors).sort(function(a,b){return vname(a)<vname(b)?-1:1});
    h+='<div class="note pv"><span>業者ページのプレビュー: <select id="pvsel" data-f="pv" aria-label="表示する業者">'+pids.map(function(id){return '<option value="'+esc(id)+'"'+(id===ENV.uid?' selected':'')+'>'+esc(vname(id))+'</option>'}).join("")+'</select> の画面です。チェックや入力は実際に保存されます。</span><button class="btn sm" data-act="pvoff">管理画面に戻る</button></div>';
  }else if(ENV.admin&&Object.keys(D.vendors).length)h+='<div style="display:flex;justify-content:flex-end;margin-top:-6px"><button class="btn sm" data-act="pvon">業者ページを確認</button></div>';
  if(ENV.mode==="local")h+='<div class="note"><span>共有保存が使えない表示です。入力はこの端末のブラウザにだけ保存され、業者とは共有されません。</span></div>';
  if(ENV.mode==="noid")h+='<div class="note bad"><span>ログイン情報を取得できません。ログインし直してください。</span></div>';
  if(ui.msg)h+='<div class="note '+ui.msgKind+'"><span>'+esc(ui.msg)+'</span></div>';
  if(ENV.admin&&!Object.keys(D.vendors).length&&!Object.keys(D.days).length&&!Object.keys(D.members).length)h+='<div class="note"><span>まだデータがありません。サンプルを入れて動きを確認できます。</span><button class="btn sm" data-act="sampleon">サンプルを入れる</button></div>';
  if(ENV.mode==="noid")h+='';
  else if(ENV.admin){
    h+=ui.tab==="cal"?renderCal(C):ui.tab==="pri"?renderPriority(C):ui.tab==="cnf"?renderConfirmed(C):ui.tab==="rec"?renderRec(C):ui.tab==="mem"?renderMem(C):ui.tab==="set"?renderSet(C):renderVin(C);
  }else h+=!vendorOk?renderReg():(ui.tab==="cal"?renderCal(C):renderVin(C));
  var box=document.createElement("div");box.innerHTML=h;
  /* 差し替え中に入力欄が外れると blur → change → render が入れ子で走るので、終わってからやり直す */
  if(morphing){morphAgain=true;return}
  morphing=true;try{morphKids(document.getElementById("app"),box,remote)}finally{morphing=false}
  if(morphAgain){morphAgain=false;render(remote)}
}

/* ---- 業者ページのプレビュー(管理者が業者の画面をそのまま確認する) ---- */
function asVendor(fn){
  if(!ui.pv||ENV.preview||!ENV.admin)return fn();
  ENV.admin=false;ENV.uid=ui.pv;ENV.preview=true;
  try{return fn()}finally{ENV.admin=true;ENV.uid=ENV.realUid;ENV.preview=false}
}
function onPreview(ev){
  var b=ev.target.closest&&ev.target.closest("[data-act]"),act=b&&b.getAttribute("data-act");
  if(act==="pvon"){var ids=Object.keys(D.vendors).sort(function(a,c){return vname(a)<vname(c)?-1:1});ui.pv=(ui.vsel&&D.vendors[ui.vsel])?ui.vsel:ids[0]||null;ui.tab="cal";ui.msg="";render();return true}
  if(act==="pvoff"){ui.pv=null;ui.tab="cal";ui.msg="";render();return true}
  return false;
}

/* ---- 操作 ---- */
function mutVendor(vid,fn){
  if(!vid)return;
  var v=clone(D.vendors[vid]||{floors:{}});v.floors=v.floors||{};fn(v);v.updated=nowIso();put("vendors",vid,v);
}
function mutDay(k,fn){
  var d=clone(D.days[k]||{cap:0,elev:[]});fn(d);put("days",k,d);
}
function sample(){
  var t=new Date(),out={vendors:{},days:{}},defs=[
    ["搬出業者A",{5:[6,4],12:[4,4],23:[3,2],38:[8,5]}],
    ["搬出業者B",{3:[5,5],18:[2,2],44:[7,3]}],
    ["搬出業者C",{9:[10,6],27:[4,4],52:[6,2],58:[3,3]}],
    ["搬出業者D",{15:[8,4],31:[5,5],47:[2,1]}]];
  defs.forEach(function(d,i){
    var fl={};Object.keys(d[1]).forEach(function(f,j){var x=new Date(t.getFullYear(),t.getMonth(),t.getDate()-((i*3+j)%7),12);fl[f]={h:d[1][f][0],w:d[1][f][1],s:nrDs(x)}});
    out.vendors["sample-"+(i+1)]={name:d[0],floors:fl,sample:true};
  });
  var n=0,k=1;
  while(n<5&&k<30){var x=new Date(t.getFullYear(),t.getMonth(),t.getDate()+k,12);k++;var w=x.getDay();if(w===0||w===6)continue;
    out.days[nrDs(x)]={cap:n%2?8:12,elev:n%2?[3]:[1,2],tf:n%2?"13:00":"10:00",tt:n%2?"15:00":"12:00",sample:true};n++}
  return out;
}
function boxVals(b){
  var to=b.querySelector('[data-role="to"]'),fl=b.querySelector('[data-role="fl"]'),q=b.querySelector('[data-role="q"]');
  return {to:to&&to.value,fl:Math.min(62,nrNum(fl&&fl.value)),q:nrNum(q&&q.value)};
}
function onClick(ev){
  var b=ev.target.closest("[data-act]");if(!b)return;
  var act=b.getAttribute("data-act"),id=b.getAttribute("data-id"),keepConfirm=false;
  ui.msg="";
  if(act==="logout"){if(window.NR_ACCOUNT)window.NR_ACCOUNT.logout();return}
  if(act==="reload"){location.reload();return}
  if(act==="tab"){ui.tab=b.getAttribute("data-tab")}
  else if(act==="prev"){ui.month=new Date(ui.month.getFullYear(),ui.month.getMonth()-1,1,12)}
  else if(act==="next"){ui.month=new Date(ui.month.getFullYear(),ui.month.getMonth()+1,1,12)}
  else if(act==="today"){var t=new Date();ui.month=new Date(t.getFullYear(),t.getMonth(),1,12);ui.sel=today()}
  else if(act==="sel"){ui.sel=b.getAttribute("data-date")}
  else if(act==="goconf"){ui.tab="cnf"}
  else if(act==="dayon"){var pt=nrCfg(D.config).perTruck;mutDay(ui.sel,function(d){d.cap=pt;d.elev=d.elev||[]})}
  else if(act==="dayoff"){
    if(ui.confirm==="dayoff"){if(D.confirmed[ui.sel])remove("confirmed",ui.sel);remove("days",ui.sel);ui.confirm=""}
    else{ui.confirm="dayoff";keepConfirm=true}
  }
  else if(act==="tplus"||act==="tminus"){
    var pt2=nrCfg(D.config).perTruck,tr=Math.ceil(nrNum((D.days[ui.sel]||{}).cap)/pt2),nt=Math.max(1,tr+(act==="tplus"?1:-1));
    mutDay(ui.sel,function(d){d.cap=nt*pt2});
  }
  else if(act==="confirm"){
    var C=compute(),s=C.sim.byDate[ui.sel];
    if(s&&s.asg.length&&!D.confirmed[ui.sel]){
      var rows=s.asg.map(function(a){return {vid:a.vid,floor:a.floor,units:a.units,ev:a.ev||null,to:a.to||null,ret:a.ret||null,n:vname(a.vid)}});
      put("confirmed",ui.sel,{rows:rows,at:nowIso()});
      ui.msg=fmtLong(ui.sel)+"の配分を確定しました。業者の「回収予定」に反映されます。";ui.msgKind="ok";
    }
  }
  else if(act==="unconfirm"){
    if(ui.confirm==="unconfirm"){remove("confirmed",ui.sel);ui.confirm=""}
    else{ui.confirm="unconfirm";keepConfirm=true}
  }
  else if(act==="cdel"){var dd=b.getAttribute("data-d"),ii=Number(b.getAttribute("data-i"));mutConfirmed(dd,function(cf){cf.rows.splice(ii,1)})}
  else if(act==="cmove"){
    var bx=b.closest(".mvbox"),dm=bx.getAttribute("data-d"),im=Number(bx.getAttribute("data-i")),bv=boxVals(bx);
    if(bv.to&&bv.fl&&bv.q&&D.confirmed[dm]){
      mutConfirmed(dm,function(cf){
        var r=cf.rows[im];if(!r)return;
        var q=Math.min(bv.q,nrNum(r.units));if(r.vid===bv.to&&r.floor===bv.fl)return;
        r.units=nrNum(r.units)-q;addRow(cf,dm,bv.to,bv.fl,q,true);
      });
    }
  }
  else if(act==="cadd"){
    var bx2=b.closest(".mvbox"),da=bx2.getAttribute("data-d"),av=boxVals(bx2),added=0;
    if(av.to&&av.fl&&av.q){mutConfirmed(da,function(cf){added=addRow(cf,da,av.to,av.fl,av.q,false)});
      if(!added){ui.msg="追加できませんでした。回収可能台数がいっぱいです。";ui.msgKind="bad"}}
    else{ui.msg="業者・階・台数を入力してください。";ui.msgKind="bad"}
  }
  else if(act==="stage"){
    var sb=b.closest(".mvbox"),sv=sb.getAttribute("data-vid"),sf=sb.getAttribute("data-fl"),se=nrNum(sb.querySelector('[data-role="ev"]').value),st=Math.min(62,nrNum(sb.querySelector('[data-role="to"]').value));
    if(!se||!st){ui.msg="集積するエレベーターと階を入力してください。";ui.msgKind="bad"}
    else if(!nrStops(st,se,nrCfg(D.config))){ui.msg="EV"+se+"は"+st+"階に停まりません。停まる階を指定してください。";ui.msgKind="bad"}
    else mutDay(ui.sel,function(d){d.moves=d.moves||{};d.moves[sv+"|"+sf]={ev:se,to:st}});
  }
  else if(act==="unstage"){var uk=b.getAttribute("data-key");mutDay(ui.sel,function(d){if(d.moves){delete d.moves[uk];if(!Object.keys(d.moves).length)delete d.moves}})}
  else if(act==="recadd"){
    var rd=document.getElementById("rec-d").value,rv=document.getElementById("rec-v").value,rf=Math.min(62,nrNum(document.getElementById("rec-f").value)),ru=nrNum(document.getElementById("rec-u").value),re=nrNum(document.getElementById("rec-e").value)||null,rm=document.getElementById("rec-m").value.trim().slice(0,100);
    if(!/^\d{4}-\d{2}-\d{2}$/.test(rd)||!rv||!rf||!ru){ui.msg="日付・業者・階・台数を入力してください。";ui.msgKind="bad"}
    else{
      var pl=clone(D.plans[rv]||{});pl.logs=pl.logs||[];
      pl.logs.push({id:"l"+Date.now().toString(36)+Math.floor(Math.random()*1e3).toString(36),d:rd,f:rf,u:ru,e:re,m:rm,at:nowIso()});
      pl.at=nowIso();put("plans",rv,pl);
      mutVendor(rv,function(v){var e=v.floors[rf]||{h:0,w:0};e.h=nrNum(e.h)+ru;v.floors[rf]=e});
      document.getElementById("rec-f").value="";document.getElementById("rec-u").value="1";document.getElementById("rec-m").value="";
      ui.msg=vname(rv)+"の"+rf+"階に"+ru+"台の追加を記録し、保有台数を増やしました。";ui.msgKind="ok";
    }
  }
  else if(act==="recdel"){
    var lv=b.getAttribute("data-vid");
    if(ui.confirm==="rd-"+id){var pl2=clone(D.plans[lv]||{}),gone=(pl2.logs||[]).filter(function(l){return l.id===id})[0];
      if(gone)mutVendor(lv,function(v){var e=v.floors[gone.f];if(!e)return;e.h=Math.max(0,nrNum(e.h)-nrNum(gone.u));if(!nrNum(e.h)&&!nrNum(e.w))delete v.floors[gone.f]});
      pl2.logs=(pl2.logs||[]).filter(function(l){return l.id!==id});pl2.at=nowIso();put("plans",lv,pl2);ui.confirm=""}
    else{ui.confirm="rd-"+id;keepConfirm=true}
  }
  else if(act==="vadd"){var nid="m"+Date.now().toString(36)+Math.floor(Math.random()*1e3).toString(36);put("vendors",nid,{name:"新しい業者",floors:{},manual:true,updated:nowIso()});ui.vsel=nid}
  else if(act==="vdel"){
    if(ui.confirm==="vdel"){var del=ui.vsel;if(D.vendors[del]&&D.vendors[del].manual){remove("vendors",del)}ui.vsel=null;ui.confirm=""}
    else{ui.confirm="vdel";keepConfirm=true}
  }
  else if(act==="regsubmit"){
    var co=document.getElementById("reg-company").value.trim(),em=document.getElementById("reg-email").value.trim(),ct=document.getElementById("reg-contact").value.trim();
    if(!co||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ui.msg="会社名と正しいメールアドレスを入力してください。";ui.msgKind="bad"}
    else{
      /* 承認なしで使えるように、登録と同時に自分の利用許可も作る(停止された人はルールで拒否される) */
      put("members",ENV.uid,{company:co,contact:ct,email:em,at:nowIso()});
      if(!D.approved[ENV.uid])put("approved",ENV.uid,{company:co,email:em,at:nowIso()});
      ui.msg="登録しました。すぐに使えます。";ui.msgKind="ok";
    }
  }
  else if(act==="approve"){var m=D.members[id];if(m){if(D.blocked[id])remove("blocked",id);put("approved",id,{company:m.company,email:m.email,at:nowIso()})}}
  else if(act==="reject"){remove("members",id)}
  else if(act==="unapprove"){
    if(ui.confirm==="un-"+id){put("blocked",id,{at:nowIso()});remove("approved",id);ui.confirm=""}else{ui.confirm="un-"+id;keepConfirm=true}
  }
  else if(act==="copyurl"){
    var inp=document.getElementById("appurl");
    try{navigator.clipboard.writeText(APP_URL).then(function(){ui.msg="URLをコピーしました。";ui.msgKind="ok";render()},function(){inp.select()})}catch(e){inp.select()}
    return;
  }
  else if(act==="sampleon"){var sm=sample();Object.keys(sm.vendors).forEach(function(k){put("vendors",k,sm.vendors[k])});var sd=Object.keys(sm.days).sort();sd.forEach(function(k){put("days",k,sm.days[k])});if(sd.length){var f0=nrPd(sd[0]);ui.month=new Date(f0.getFullYear(),f0.getMonth(),1,12);ui.sel=sd[0]}ui.vsel=null}
  else if(act==="sampleoff"){
    if(ui.confirm==="sampleoff"){
      Object.keys(D.days).forEach(function(k){if(D.days[k].sample){if(D.confirmed[k])remove("confirmed",k);remove("days",k)}});
      Object.keys(D.vendors).forEach(function(k){if(D.vendors[k].sample)remove("vendors",k)});
      ui.confirm=""}
    else{ui.confirm="sampleoff";keepConfirm=true}
  }
  if(!keepConfirm&&act!=="vdel"&&act!=="unconfirm"&&act!=="dayoff"&&act!=="sampleoff"&&act!=="unapprove"&&act!=="recdel")ui.confirm="";
  render();
}
function onChange(ev){
  var el=ev.target,f=el.getAttribute&&el.getAttribute("data-f");if(!f)return;
  ui.msg="";
  var c=clone(D.config||{});
  var vid=ENV.admin?ui.vsel:ENV.uid;
  if(f==="vsel"){ui.vsel=el.value||null;ui.confirm=""}
  else if(f==="only"){ui.only=el.checked}
  else if(f==="cap"){var v=nrNum(el.value);if(v===0){if(D.confirmed[ui.sel])remove("confirmed",ui.sel);remove("days",ui.sel)}else mutDay(ui.sel,function(d){d.cap=v})}
  else if(f==="tf"||f==="tt"){var tv=nrTime(el.value);if(tv===null){ui.msg="時間は「1030」や「10:30」のように入力してください。";ui.msgKind="bad"}else{el.value=tv;mutDay(ui.sel,function(d){d[f]=tv})}}
  else if(f==="elev"){var e=Number(el.getAttribute("data-e"));mutDay(ui.sel,function(d){var a=(d.elev||[]).filter(function(x){return x!==e});if(el.checked)a.push(e);a.sort();d.elev=a})}
  else if(f==="vname"){mutVendor(vid,function(v){v.name=el.value.trim()})}
  else if(f==="vnote"){mutVendor(vid,function(v){v.note=el.value.slice(0,500)})}
  else if(f==="floor"){
    var fl=el.getAttribute("data-fl"),k=el.getAttribute("data-k"),val=nrNum(el.value);
    mutVendor(vid,function(v){
      var e=v.floors[fl]||{h:0,w:0},old=nrNum(e.w);e[k]=val;
      if(k==="w"&&val>0&&!(old>0))e.s=today();
      if(!nrNum(e.h)&&!nrNum(e.w))delete v.floors[fl];else v.floors[fl]=e;
    });
  }
  else if(f==="same"){var fl2=el.getAttribute("data-fl");mutVendor(vid,function(v){var e=v.floors[fl2];if(!e)return;e.same=el.checked;if(el.checked)delete e.r})}
  else if(f==="ret"){var fl3=el.getAttribute("data-fl");mutVendor(vid,function(v){var e=v.floors[fl3];if(!e)return;e.r=Math.min(62,nrNum(el.value))})}
  else if(f==="placed"){
    var pd=el.getAttribute("data-d"),pv=el.getAttribute("data-vid"),pf=el.getAttribute("data-fl");
    var ps=document.getElementById("pe-"+pd+"-"+pv+"-"+pf),pe=ps?nrNum(ps.value)||null:null;
    if(ENV.admin||pv===ENV.uid)mutVendor(pv,function(v){v.placed=v.placed||{};if(el.checked)v.placed[pd+"|"+pf]={at:nowIso(),ev:pe};else delete v.placed[pd+"|"+pf]});
  }
  else if(f==="placedev"){
    var qd=el.getAttribute("data-d"),qv=el.getAttribute("data-vid"),qf=el.getAttribute("data-fl"),qk=qd+"|"+qf;
    if(ENV.admin||qv===ENV.uid)mutVendor(qv,function(v){if(!v.placed||!v.placed[qk])return;var o=v.placed[qk];v.placed[qk]={at:typeof o==="object"?o.at:o,ev:nrNum(el.value)||null}});
  }
  else if(f==="back"||f==="backev"||f==="backu"){
    var bd=el.getAttribute("data-d"),bi=Number(el.getAttribute("data-i"));
    var fx=null;
    mutConfirmed(bd,function(cf){var r=cf.rows[bi];if(!r)return;
      if(f==="back"){
        if(el.checked&&!r.back){r.back={ev:placedEv(bd,r)||r.ev||((D.days[bd]||{}).elev||[])[0]||1,u:nrNum(r.units),at:nowIso()};r.back.adj=backAdj(r,r.back.u);fx=[r.vid,r.back.adj,1]}
        else if(!el.checked&&r.back){if(r.back.adj)fx=[r.vid,r.back.adj,-1];delete r.back}
      }
      else if(r.back){
        if(f==="backev")r.back.ev=nrNum(el.value)||1;
        else{var nu=nrNum(el.value),du=nu-nrNum(r.back.u),to=String(nrNum(r.ret)||r.floor);r.back.u=nu;
          if(r.back.adj&&du){var one={};one[to]={h:du,w:0};r.back.adj[to]=r.back.adj[to]||{h:0,w:0};r.back.adj[to].h+=du;fx=[r.vid,one,1]}}
        r.back.at=nowIso();
      }
    });
    if(fx){applyAdj(fx[0],fx[1],fx[2]);ui.msg=vname(fx[0])+"の保有台数と回収希望を"+(fx[2]>0?"更新":"元に戻")+"しました。";ui.msgKind="ok"}
  }
  else if(f==="company"){var id2=el.getAttribute("data-id"),nm=el.value.trim();if(D.approved[id2]&&nm){var a=clone(D.approved[id2]);a.company=nm;put("approved",id2,a)}}
  else if(f==="cunits"){
    var d3=el.getAttribute("data-d"),i3=Number(el.getAttribute("data-i"));
    mutConfirmed(d3,function(cf){var r=cf.rows[i3];if(!r)return;var cap=nrNum((D.days[d3]||{}).cap),room=Math.max(0,cap-rowsTotal(cf,i3));r.units=Math.min(nrNum(el.value),room)});
  }
  else if(f==="wd"){var wv=el.getAttribute("data-vid"),ww=Number(el.getAttribute("data-w"));c.wd=c.wd||{};
    var wa=(c.wd[wv]||[]).filter(function(x){return x!==ww});if(el.checked)wa.push(ww);wa.sort();if(wa.length)c.wd[wv]=wa;else delete c.wd[wv];putCfg(c)}
  else if(f==="perTruck"||f==="wP"||f==="wW"||f==="wH"||f==="crit"){c[f]=f==="perTruck"?(nrNum(el.value)||NR_DEF.perTruck):f==="crit"?Math.min(100,Math.max(1,nrNum(el.value)||100)):nrW(el.value,NR_DEF[f]);putCfg(c)}
  else if(f==="evr"){var e2=el.getAttribute("data-e"),i=Number(el.getAttribute("data-k"));c.ev=c.ev||{};var r2=(c.ev[e2]||[1,62]).slice();r2[i]=Math.min(62,nrNum(el.value)||(i?62:1));c.ev[e2]=r2;putCfg(c)}
  else if(f==="ns"){var e3=el.getAttribute("data-e");c.ns=c.ns||{};c.ns[e3]=el.value.trim();putCfg(c)}
  render();
}
var app=document.getElementById("app");
app.addEventListener("click",function(ev){if(!onPreview(ev))asVendor(function(){onClick(ev)})});
app.addEventListener("change",function(ev){
  if(ev.target.getAttribute&&ev.target.getAttribute("data-f")==="pv"){ui.pv=ev.target.value||null;render();return}
  asVendor(function(){onChange(ev)});
});
window.nrBoot=boot;
})();
</script>

<script>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,signInWithEmailAndPassword,createUserWithEmailAndPassword,sendPasswordResetEmail,sendEmailVerification,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {initializeFirestore,collection,doc,onSnapshot,setDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

var CFG=window.NR_CONFIG,app=document.getElementById("app");
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}

if(!CFG.firebase.apiKey||/^YOUR_/.test(CFG.firebase.apiKey)){
  app.innerHTML='<section class="panel login"><h1>スクラップ搬出 調整</h1><div class="note bad"><span>Firebaseの設定がまだ入っていません。index.html の NR_CONFIG にFirebaseの設定を入れてください。</span></div></section>';
}else start();

function start(){
  var fb=initializeApp(CFG.firebase),auth=getAuth(fb),fs=initializeFirestore(fb,{ignoreUndefinedProperties:true},CFG.databaseId||"(default)");
  var booted=false;
  getRedirectResult(auth).catch(fail);
  onAuthStateChanged(auth,function(u){
    if(!u){if(booted){location.reload();return}showLogin();return}
    if(booted)return;booted=true;
    var admin=!!(u.email&&u.emailVerified&&CFG.adminEmails.map(function(e){return e.toLowerCase()}).indexOf(u.email.toLowerCase())>=0);
    window.NR_ACCOUNT={email:u.email,logout:function(){signOut(auth)}};
    window.NR_RUNTIME={use:async function(n){return n==="db"?makeDb(fs,u,admin):n==="user"?makeUser(u,admin):null}};
    if(!admin)watchApproval(fs,u);
    window.nrBoot();
  });

  /* ログイン画面 */
  var mode="login",msg="",kind="";
  function showLogin(){
    var reg=mode==="reg";
    app.innerHTML='<section class="panel login"><h1>スクラップ搬出 調整</h1>'
      +'<p class="hint" style="margin:0">'+(reg?'業者の方は、ここでアカウントを作ってから会社名を登録すると、すぐに使えます。':'ログインしてください。初めての業者の方は「新規登録」から始めます。')+'</p>'
      +(msg?'<div class="note '+kind+'"><span>'+esc(msg)+'</span></div>':'')
      +'<button class="btn" id="lg-google" type="button">Googleアカウントでログイン</button>'
      +'<div class="sep">またはメールアドレス</div>'
      +'<div class="lbl"><label for="lg-email">メールアドレス</label><input type="email" id="lg-email" autocomplete="email"></div>'
      +'<div class="lbl"><label for="lg-pass">パスワード'+(reg?'(6文字以上)':'')+'</label><input type="password" id="lg-pass" autocomplete="'+(reg?'new-password':'current-password')+'"></div>'
      +'<button class="btn primary" id="lg-go" type="button">'+(reg?'新規登録':'ログイン')+'</button>'
      +'<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><button class="linkbtn" id="lg-mode" type="button">'+(reg?'アカウントをお持ちの方はログイン':'新規登録はこちら')+'</button>'
      +(reg?'':'<button class="linkbtn" id="lg-reset" type="button">パスワードを忘れた</button>')+'</div></section>';
    /* ポップアップが止められるブラウザ(一部のSafariやアプリ内ブラウザ)では、ページ移動式のログインに切り替える */
    document.getElementById("lg-google").onclick=function(){
      var pr=new GoogleAuthProvider();
      signInWithPopup(auth,pr).catch(function(e){
        var c=(e&&e.code)||"";
        if(c==="auth/popup-blocked"||c==="auth/operation-not-supported-in-this-environment"||c==="auth/web-storage-unsupported")signInWithRedirect(auth,pr).catch(fail);
        else fail(e);
      });
    };
    document.getElementById("lg-mode").onclick=function(){mode=reg?"login":"reg";msg="";showLogin()};
    var rs=document.getElementById("lg-reset");
    if(rs)rs.onclick=function(){var em=val("lg-email");if(!em){say("メールアドレスを入れてから押してください。","bad");return}
      sendPasswordResetEmail(auth,em).then(function(){say("パスワード再設定のメールを送りました。","ok")},fail)};
    document.getElementById("lg-go").onclick=function(){
      var em=val("lg-email"),pw=document.getElementById("lg-pass").value;
      if(!em||!pw){say("メールアドレスとパスワードを入れてください。","bad");return}
      if(reg)createUserWithEmailAndPassword(auth,em,pw).then(function(c){return sendEmailVerification(c.user).catch(function(){})}).catch(fail);
      else signInWithEmailAndPassword(auth,em,pw).catch(fail);
    };
  }
  function val(id){return document.getElementById(id).value.trim()}
  function say(m,k){msg=m;kind=k;showLogin()}
  function fail(e){
    var c=(e&&e.code)||"",m={"auth/invalid-credential":"メールアドレスかパスワードが違います。","auth/wrong-password":"メールアドレスかパスワードが違います。","auth/user-not-found":"このメールアドレスのアカウントはありません。",
      "auth/email-already-in-use":"このメールアドレスは登録済みです。ログインしてください。","auth/weak-password":"パスワードは6文字以上にしてください。","auth/invalid-email":"メールアドレスの形が正しくありません。",
      "auth/popup-closed-by-user":"ログインがキャンセルされました。","auth/too-many-requests":"試行回数が多すぎます。しばらくしてからもう一度試してください。",
      "auth/unauthorized-domain":"このURLはFirebaseの承認済みドメインに入っていません。管理者に連絡してください。","auth/network-request-failed":"通信できませんでした。電波の良い所で再読み込みしてください。",
      "auth/cancelled-popup-request":"ログインがキャンセルされました。","auth/internal-error":"ログインに失敗しました。ページを再読み込みしてもう一度試してください。"}[c];
    say(m||("ログインできませんでした("+c+")"),"bad");
  }
}

/* アプリが使うデータベースの形(collection().onSnapshot / doc().set・delete・onSnapshot)に合わせる。
   業者は自分の文書しか読めないので、業者用の一覧は自分の1件だけを見る */
var OWN=["vendors","members","approved","blocked","plans"];
/* 同じFirebaseで別アプリ(スクラップ搬出など)を動かすときは、コレクション名の頭に付ける文字(NR_CONFIG.prefix)でデータを分ける */
var PFX=CFG.prefix||"";
function makeDb(fs,u,admin){
  /* 承認前の業者は回収日などを読めないので、その拒否だけは空として扱う。管理者の拒否はルールの設定漏れなので画面に出す */
  function quiet(cb,empty,err){return function(e){if(!admin&&e&&e.code==="permission-denied")cb(empty);else if(err)err(e)}}
  return {
    collection:function(c){return {onSnapshot:function(cb,err){
      if(!admin&&OWN.indexOf(c)>=0)
        return onSnapshot(doc(fs,PFX+c,u.uid),function(s){cb({docs:s.exists()?[{id:s.id,data:function(){return s.data()}}]:[]})},quiet(cb,{docs:[]},err));
      return onSnapshot(collection(fs,PFX+c),function(q){cb({docs:q.docs.map(function(d){return {id:d.id,data:function(){return d.data()}}})})},quiet(cb,{docs:[]},err));
    }}},
    doc:function(p){var r=doc(fs,PFX+p);return {
      set:function(d){return setDoc(r,d)},
      delete:function(){return deleteDoc(r)},
      onSnapshot:function(cb,err){return onSnapshot(r,function(s){cb({exists:s.exists(),data:function(){return s.data()}})},quiet(cb,{exists:false,data:function(){}},err))}
    }}
  };
}
function makeUser(u,admin){
  return {me:async function(){return {id:u.uid,email:u.email||"",name:u.displayName||""}},id:async function(){return u.uid},canEdit:async function(){return admin}};
}
/* 承認されたら、読めるようになったデータを読み直すために開き直す */
function watchApproval(fs,u){
  var was=null;
  /* 自分の登録で作った許可は、サーバーに保存されてから開き直す(保存前に開き直すと書き込みが消える) */
  onSnapshot(doc(fs,PFX+"approved",u.uid),{includeMetadataChanges:true},function(s){if(s.metadata&&s.metadata.hasPendingWrites)return;var now=s.exists();if(was===false&&now)location.reload();was=now},function(){});
}
</script>
