# お知らせの送信(10分ごと。GitHub の都合で遅れたり間が空いたりすることがあります): プッシュ通知とメール
# アプリが入れた送信待ち(outbox)だけを読み、宛先ごとにまとめて送ります。送信待ちがなければ数回の読み取りで終わります。
# 必要な設定(リポジトリの Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT  Firebase のサービスアカウントの鍵(毎朝の自動処理と同じもの)
#   MAIL_USER / MAIL_PASS     メールも送るときだけ。送信に使う Gmail のアドレスとアプリ パスワード
# プッシュ通知の鍵は最初の実行で自動で作り、Firestore に保存します(追加の設定はいりません)。
name: notify
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notify
  cancel-in-progress: false
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        working-directory: server
      - run: node server/notify.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
