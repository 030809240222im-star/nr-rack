# プッシュ通知(5分ごと。GitHub の都合で遅れたり間が空いたりすることがあります)
# 必要な設定(リポジトリの Settings → Secrets and variables → Actions):
#   FIREBASE_SERVICE_ACCOUNT  Firebase のサービスアカウントの鍵(毎朝の自動処理と同じもの)
# 通知の鍵は最初の実行で自動で作り、Firestore に保存します(追加の設定はいりません)。
name: push
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: push
  cancel-in-progress: false
jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
        working-directory: server
      - run: node server/push.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
